<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHAR · Админ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#FAF8F3;--surface:#fff;--sand:#F1EBDD;--text:#231A10;--muted:#7A6A55;--gold1:#C9A24B;--gold2:#A67C2E;--hair:#D9C48F;--ok:#3E7B5A;--err:#B3483B}
[data-theme="dark"]{--bg:#14100B;--surface:#1E1812;--sand:#241D14;--text:#F5EFE4;--muted:#A08D74;--hair:#3A3021;--ok:#5FA37E;--err:#C96A5D}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font:600 14px 'Manrope';overflow-x:hidden}
.serif{font-family:'Playfair Display',serif}
.hidden{display:none!important}
::-webkit-scrollbar{display:none}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 90px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Playfair Display';font-weight:900;font-size:21px;background:linear-gradient(120deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:10px;font-weight:800;color:var(--muted);border:1px solid var(--hair);padding:4px 10px;border-radius:9px}
#noAccess{text-align:center;padding-top:30vh}
.tabs{display:flex;gap:6px;margin:16px 0 14px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tab{flex:none;padding:9px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--hair);font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;border-color:transparent}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:15px;box-shadow:0 6px 18px rgba(35,26,16,.08)}
.stat .sv{font-family:'Playfair Display';font-size:23px;font-weight:900;margin-top:3px}
.stat .sl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 6px 18px rgba(35,26,16,.08)}
.card.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:9px;white-space:nowrap}
.st-new{background:var(--sand);color:var(--muted)} .st-awaiting_payment{background:#F7EEDC;color:var(--gold2)}
.st-paid,.st-confirmed,.st-delivered{background:#EBF3EC;color:var(--ok)} .st-packing,.st-shipping{background:#F7EEDC;color:var(--gold2)}
.st-cancelled,.st-refunded{background:#F6E7E4;color:var(--err)}
.STR{new:'Новый',awaiting_payment:'Принят',paid:'Принят',confirmed:'Принят',packing:'Принят',shipping:'В доставке',delivered:'Доставлен',cancelled:'Отменён',refunded:'Отменён'}
.btn{display:inline-block;border:none;border-radius:13px;padding:11px 15px;font:800 13px 'Manrope';cursor:pointer}
.btn-gold{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff}
.btn-ghost{background:var(--bg);border:1px solid var(--hair);color:var(--text)}
.btn-del{background:#F6E7E4;color:var(--err)}
.btn-xs{padding:7px 11px;font-size:11.5px;border-radius:10px}
.btn.blk{display:block;width:100%;text-align:center;margin-top:10px}
.field{background:var(--surface);border:1px solid var(--hair);border-radius:13px;padding:10px 14px;margin-top:9px}
.field label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:none;outline:none;background:transparent;color:var(--text);font:600 14px 'Manrope'}
.field textarea{resize:none}
.frow{display:flex;gap:9px}.frow .field{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 17px;border-radius:12px;font-weight:700;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:85%}
#toast.show{opacity:1}
.muted{color:var(--muted)}
.gold{background:linear-gradient(120deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.empty{text-align:center;padding:40px 14px;color:var(--muted)}
.sect-t{font-family:'Playfair Display';font-size:18px;font-weight:700;margin:16px 0 4px}
.img-prev{width:100%;max-height:170px;object-fit:cover;border-radius:12px;margin-top:8px;background:var(--sand)}
.lines .card{margin-top:8px;padding:12px}
a{color:var(--gold2)}
#sheet{position:fixed;inset:0;z-index:70;background:rgba(20,16,11,.5);display:none}
#sheet.open{display:block}
#sheetIn{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:86dvh;overflow-y:auto;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.kb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;gap:6px;margin-top:9px}
.seg button{flex:1;border:1.5px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 6px;font:800 12.5px 'Manrope';cursor:pointer;color:var(--text)}
.seg button.on{background:#4B2B20;color:#fff;border-color:#4B2B20}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ph-cell{position:relative;border-radius:10px;overflow:hidden;background:var(--sand)}
.ph-cell img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ph-cell .main-mark{position:absolute;top:4px;left:4px;background:#4B2B20;color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:2px 5px}
.ph-acts{display:flex;gap:3px;padding:4px}
.ph-acts button{flex:1;border:none;background:var(--sand);border-radius:7px;font-size:13px;padding:5px 0;cursor:pointer}
.em-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.em-grid button{font-size:24px;background:none;border:none;border-radius:9px;padding:6px 0;cursor:pointer}
.em-grid button.on{background:#4B2B20;border-radius:9px}
.prev-phone{width:100%;max-width:360px;margin:12px auto;border:5px solid #4B2B20;border-radius:34px;padding:10px 10px 14px;background:var(--sand)}
.prev-screen{position:relative;height:180px;border-radius:20px;overflow:hidden;background:var(--sand)}
.prev-screen img{width:100%;height:100%;object-fit:cover;display:block}
.prev-txt{position:absolute;left:0;right:0;bottom:0;padding:44px 13px 11px;color:#fff}
.prev-txt .pbt{font:800 16px 'Manrope';line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev-txt .pbs{font:600 10.5px 'Manrope';margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-btn{display:inline-block;margin-top:8px;background:#fff;color:#4B2B20;font:800 11px 'Manrope';border-radius:12px;padding:7px 13px}
.crop-ov{position:fixed;inset:0;background:rgba(20,12,6,.94);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.crop-ov.hidden{display:none}
#cropCv{touch-action:none;border-radius:14px;background:#F1EBDD}
input[type=range]{width:100%;margin-top:14px;accent-color:#4B2B20}
.bulkbar{background:#4B2B20;border-radius:14px;padding:10px;margin-top:10px;color:#fff;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bulkbar button{border:none;border-radius:10px;padding:9px 11px;font:800 12px 'Manrope';cursor:pointer}
.bulkbar select,.bulkbar input{border:none;border-radius:9px;padding:8px;font:700 12px 'Manrope'}
.kb button{padding:8px 12px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);font:700 12px 'Manrope';cursor:pointer;color:var(--text)}
.kb button.on{border-color:var(--gold1);color:var(--gold2)}
</style>
</head>
<body>
<div id="app">
  <div class="hrow"><div class="logo">SAHAR · CRM</div><div class="badge" id="myId">…</div></div>
  <div id="noAccess" class="hidden"><div class="serif" style="font-size:24px;font-weight:700">Нет доступа</div>
    <p class="muted" style="margin-top:8px;font-size:13px">Панель открыта только для владельцев магазина. Ваш Telegram ID:</p>
    <div class="card row" style="margin-top:16px"><span id="accId" style="font-weight:900"></span><span class="pill st-new">не владелец</span></div>
    <p class="muted" style="margin-top:14px;font-size:12px">Добавьте свой ID в OWNER_IDS (Cloudflare) или откройте панель из бота владельца.</p></div>
  <div id="panel" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </div>
</div>
<div id="sheet"><div id="sheetIn"></div></div>
<div id="cropWrap" class="crop-ov hidden">
  <div style="color:#fff;font:800 15px 'Manrope';margin-bottom:10px">Обрежьте фото (1:1) — двигайте и приближайте</div>
  <canvas id="cropCv" width="320" height="320"></canvas>
  <div style="width:280px"><input type="range" id="cropZoom" min="0" max="100" value="0" oninput="cropZoomSet(this.value)"></div>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button class="btn btn-gold" onclick="cropDone()">✔ Готово</button>
    <button class="btn btn-ghost" onclick="cropCancel()" style="background:#fff;color:#4B2B20">Отмена</button>
  </div>
</div>
<input type="file" id="multiPhotoFile" accept="image/*" multiple class="hidden" onchange="onPickMulti(event)">
<div id="toast"></div>
<input type="file" id="photoFile" accept="image/*" class="hidden" onchange="onPickPhoto(event)">
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const API = 'https://sahar-shop.dostonravshanov1006800.workers.dev';
const $ = id => document.getElementById(id);
const STR = {new:'Новый',awaiting_payment:'Принят',paid:'Принят',confirmed:'Принят',packing:'Принят',shipping:'В доставке',delivered:'Доставлен',done:'Доставлен',cancelled:'Отменён',refunded:'Отменён'};
const STC = s => ({new:'st-new',awaiting_payment:'st-awaiting_payment',paid:'st-paid',confirmed:'st-confirmed',packing:'st-packing',shipping:'st-shipping',delivered:'st-delivered',cancelled:'st-cancelled',refunded:'st-refunded'}[s]||'st-new');
const NEXT = { new:['confirmed','cancelled'], awaiting_payment:['confirmed','cancelled'], paid:['confirmed','cancelled'], confirmed:['shipping','cancelled'], packing:['shipping','cancelled'], shipping:['delivered'], delivered:[], cancelled:[], refunded:[] };
const BTNT = { confirmed:'✅ Принять', cancelled:'❌ Отменить', shipping:'🚚 В доставку', delivered:'🏁 Доставлен' };
function escHtml(x){ return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let busy = false;
async function guard(fn){
  if (busy) { toast('Уже выполняется…'); return; }
  busy = true;
  try { await fn(); } catch(e){ toast('Ошибка: ' + e.message); } finally { busy = false; }
}
function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2400); }
async function api(path, body){
  const initData = tg && tg.initData ? { initData: tg.initData } : {};
  const r = await fetch(API + '/api' + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ...initData, ...(body || {}) }) });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || 'HTTP ' + r.status); }
  return r.json();
}
const S = { pendingChatPhoto: '' };
let threadTimer = null, TAB = 'dash', cats = [], prodsCache = [], chatTid = 0, editPid = null, editBannerId = null, editCatId = null, pfImages = [];
let plQ = '', plCat = 'all', plHidden = false, plOut = false, plSel = new Set();
const TABS = [['dash','📊 Дашборд'],['orders','📦 Заказы'],['products','🍯 Товары'],['design','🎨 Оформление'],['clients','👥 Клиенты'],['chat','💬 Сообщения'],['more','⋯ Ещё']];
function renderTabs(){ $('tabs').innerHTML = TABS.map(([id,n])=>`<button class="tab ${TAB===id?'on':''}" onclick="TAB='${id}';renderTabs();render()">${n}</button>`).join('');
  const el = document.querySelector('.tab.on'); if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }
async function render(){
  const c = $('content');
  try {
    if (TAB==='dash') return renderDash();
    if (TAB==='orders') return renderOrders();
    if (TAB==='products') return renderProducts();
    if (TAB==='clients') return renderClients();
    if (TAB==='chat') return renderChatList();
    if (TAB==='design') return renderDesign();
    if (TAB==='cats') return renderCats();
    if (TAB==='banners') return renderBannersAdm();
    if (TAB==='promos') return renderPromos();
    if (TAB==='more') return renderMore();
  } catch(e){ c.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`; }
}
// ---------- Дашборд ----------
async function renderDash(){
  const s = await api('/admin/stats');
  $('content').innerHTML = `
  <div class="cards">
    <div class="stat"><div class="sl">Новые</div><div class="sv" style="color:var(--gold2)">${s.new}</div></div>
    <div class="stat"><div class="sl">Всего заказов</div><div class="sv">${s.orders}</div></div>
    <div class="stat"><div class="sl">Выручка</div><div class="sv">${s.revenue_rub!=null?((s.revenue_rub).toLocaleString('ru-RU')+' ₽'):('$'+s.revenue_usd.toLocaleString('en-US'))}</div><div class="muted" style="font-size:10.5px">~$${s.revenue_usd.toLocaleString('en-US')}</div></div>
    <div class="stat"><div class="sl">Клиенты</div><div class="sv">${s.clients}</div></div>
  </div>
  <div class="card row"><div><b>Магазин открыт</b><div class="muted" style="font-size:12px">${s.shop_open?'Заказы принимаются':'Витрина видна, заказы выключены'}</div></div>
    <button class="btn ${s.shop_open?'btn-gold':'btn-ghost'} btn-xs" onclick="toggleShop(${s.shop_open})">${s.shop_open?'Закрыть':'Открыть'}</button></div>
  <div class="sect-t">Последние заказы</div>
  ${s.recent.map(o=>`<div class="card row"><b>#${o.id} · ${o.client}</b><span class="gold">${o.total_local}</span><span class="pill ${STC(o.status)}">${STR[o.status]}</span></div>`).join('') || '<div class="empty">Заказов пока нет</div>'}`;
}
async function toggleShop(open){
  const st = await api('/admin/settings');
  const settings = st.settings ? st.settings : st;
  settings.shop_open = !open;
  await api('/admin/settings', { settings });
  toast(settings.shop_open ? 'Магазин открыт' : 'Магазин закрыт'); render();
}
// ---------- Заказы ----------
let ordersCache = [], ordQuery = '';
function ordMatches(o){ const cl=o.client||{}; return !ordQuery || ('#'+o.id+' '+(cl.first_name||'')+' '+(cl.username||'')+' '+(o.phone||'')+' '+(o.city||'')+' '+(o.tracking||'')).toLowerCase().includes(ordQuery); }
function ordCard(o){ return `
  <div class="card">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center">
      <b class="serif" style="font-size:16px">#${o.id}</b>
      <span class="pill ${STC(o.status)}">${STR[o.status]}</span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:4px">${(o.created_at||'').slice(0,16).replace('T',' ')}</div>
    <div style="margin-top:8px;font-size:13px">${o.items.map(i=>`+${i.qty}· ${escHtml(i.name_ru)}`).join('<br>')}</div>
    <div class="muted" style="font-size:12.5px;margin-top:8px">
      ${escHtml(o.client.first_name||'')}${o.client.username?' · @'+escHtml(o.client.username):''} · <a href="https://t.me/${o.client.username||'user'}">${o.client.telegram_id}</a><br>
      ${o.phone?escHtml(o.phone)+' ':''}<button class="btn btn-ghost btn-xs" onclick="copyAddr(${o.id})">📋 копия</button><br>${escHtml([o.country,o.city,o.address].filter(Boolean).join(', '))}<br>
      ${{cash:'Наличные',card:'Перевод на карту',spb:'СБП',kaspi:'Kaspi',erip:'ЕРИП',click:'Click',payme:'Payme'}[o.payment_method]||o.payment_method} · ${o.delivery==='courier'?'курьер':'почта'}
      ${o.comment?'<br>💬 '+escHtml(o.comment):''}
    </div>
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span class="gold" style="font-size:16px">${o.total_local||'—'}</span>
      ${(NEXT[o.status]||[]).map(st2=>`<button class="btn btn-xs ${st2==='cancelled'||st2==='refunded'?'btn-del':'btn-gold'}" onclick="setStatus(${o.id},'${st2}')">${BTNT[st2]}</button>`).join('')}
    </div>
    ${o.delivery!=='courier'||o.status==='shipping'?`<div class="field" style="margin-top:8px"><label>Трек-номер</label><input id="trk${o.id}" value="${o.tracking||''}" onchange="setTracking(${o.id},this.value)"></div>`:''}
  </div>`; }
function copyAddr(id){ const o = ordersCache.find(x=>x.id===id); if(!o) return; const a=[o.country,o.city,o.address].filter(Boolean).join(', ')+' · '+o.phone; navigator.clipboard && navigator.clipboard.writeText(a); toast('Скопировано'); }
function exportCsv(){
  const rows = [['id','дата','клиент','телефон','страна','город','адрес','сумма','оплата','статус','состав'].join(';')];
  ordersCache.forEach(o=>rows.push([o.id,(o.created_at||'').slice(0,16),(o.client||{}).first_name||'',o.phone,o.country,o.city,String(o.address||'').replace(/;/g,','),o.total_local,o.payment_method,o.status,(o.items||[]).map(i=>i.name_ru+' x'+i.qty).join(', ')].map(x=>String(x||'').replace(/;/g,',')).join(';')));
  const blob = new Blob(['\ufeff'+rows.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sahar_orders.csv'; a.click(); toast('CSV скачан');
}
async function renderOrders(){
  const orders = await api('/admin/orders');
  ordersCache = orders;
  const found = orders.filter(ordMatches);
  $('content').innerHTML = `
  <div class="field"><label>Поиск: №, имя, телефон, город</label><input id="ordQ" value="${escHtml(ordQuery)}" oninput="ordQuery=this.value.toLowerCase();$('ordList').innerHTML=ordersCache.filter(ordMatches).map(ordCard).join('')||'<div class=\'empty\'>Ничего не найдено</div>'"></div>
  <button class="btn btn-ghost blk" style="margin-top:8px" onclick="exportCsv()">⬇️ Экспорт CSV (${orders.length})</button>
  <div id="ordList">${found.map(ordCard).join('') || '<div class="empty">Заказов нет</div>'}</div>`;
}
function setStatus(id, status){ guard(async ()=>{
  await api('/admin/order', { id, status }); toast('#'+id+' → '+STR[status]); render();
}); }
async function setTracking(id, tracking){
  await api('/admin/order', { id, tracking }); toast('Трек сохранён'); render();
}
// ---------- Товары ----------
async function renderProducts(){
  const d = await api('/admin/products');
  prodsCache = d.products; cats = d.categories;
  const del = d.deleted || [];
  let list = prodsCache.slice();
  if (plQ) list = list.filter(p => ((p.name_ru||'')+' '+(p.name_en||'')+' '+(p.name_uz||'')).toLowerCase().includes(plQ.toLowerCase()));
  if (plCat !== 'all') list = list.filter(p => String(p.cat) === String(plCat));
  if (plHidden) list = list.filter(p => p.is_active === false);
  if (plOut) list = list.filter(p => !p.stock);
  list.sort((a,b)=>(a.sort||0)-(b.sort||0));
  const catName = id => { const c = cats.find(x=>String(x.id)===String(id)); return c?c.name_ru:'Без категории'; };
  $('content').innerHTML = `
  <button class="btn btn-gold blk" onclick="editPid=null;openProductForm()">＋ Добавить товар</button>
  <div class="field"><input id="plq" placeholder="🔍 Поиск по названию" value="${escHtml(plQ)}" oninput="plQ=this.value;renderProducts()"></div>
  <div style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap">
    <select style="flex:1;min-width:130px;border:1px solid var(--hair);border-radius:12px;padding:10px;font:700 12.5px 'Manrope'" onchange="plCat=this.value;renderProducts()">
      <option value="all" ${plCat==='all'?'selected':''}>Все категории</option>
      <option value="0" ${plCat==='0'?'selected':''}>Без категории</option>
      ${cats.map(c=>`<option value="${c.id}" ${String(plCat)===String(c.id)?'selected':''}>${c.name_ru}</option>`).join('')}
    </select>
    <button class="btn btn-ghost btn-xs" style="flex:1" onclick="plHidden=!plHidden;renderProducts()">${plHidden?'☑ Скрытые':'☐ Скрытые'}</button>

function moveProduct(id, dir){ guard(async ()=>{
  const cur = prodsCache.find(x=>x.id===id); if (!cur) return;
  const sorted = prodsCache.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
  const i = sorted.findIndex(x=>x.id===id), j = i + dir;
  if (j < 0 || j >= sorted.length) return;
  await api('/admin/product', { product: { id: sorted[i].id, sort: sorted[j].sort || (j+1) } });
  await api('/admin/product', { product: { id: sorted[j].id, sort: sorted[i].sort || (i+1) } });
  toast('Порядок изменён'); renderProducts();
}); }
function purgeProduct(id){ const p = prodsCache.find(x=>x.id===id) || {};

async function onPickPhoto(ev){
  const f = ev.target.files[0]; if (!f) return;
  const tgt = S.pickTarget || ''; S.pickTarget = '';
  if (tgt === 'bannerPhoto') { startCrop(f, async (data) => {
      try { window._bn.image_url = await uploadB64(data); toast('Фото баннера загружено');
        const bOpen = $('sheet').classList.contains('open'); if (bOpen) { bnPrev(); openBannerForm(); } }
      catch(e){ toast('Не удалось загрузить: ' + e.message); } }); return; }
  if (tgt === 'catIcon') { startCrop(f, async (data) => {
      try { window._cat.icon_url = await uploadB64(data); window._cat.icon = '';
        if ($('cfIconPrev')) { $('cfIconPrev').innerHTML = '<img src="' + window._cat.icon_url + '" style="width:30px;height:30px;border-radius:8px;object-fit:cover">'; $('cfIconCustom').value = ''; }
        toast('Иконка загружена'); }
      catch(e){ toast('Не удалось загрузить: ' + e.message); } }); return; }
  if (tgt === 'productPhoto') { startCrop(f, async (data) => {
      try { pfImages.push(await uploadB64(data)); renderPhotoGrid(); }
      catch(e){ toast('Не удалось загрузить: ' + e.message); } }); return; }
  try {
    const b64 = await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); const sc=Math.min(1,900/Math.max(img.width,img.height)); c.width=img.width*sc;c.height=img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.85)); }; img.onerror=rej; img.src=URL.createObjectURL(f); });
    const r = await api('/admin/upload', { b64: b64.split(',')[1], mime:'image/jpeg' });
    const target = S.pickTarget || ($('sheet').classList.contains('open') ? ($('bnImg') ? 'banner' : 'product') : (TAB==='chat' && chatTid ? 'chat' : ''));
    S.pickTarget = '';
    if (target === 'chat' && chatTid) { S.pendingChatPhoto = r.url; toast('Фото готово — нажмите ➤'); }
    else if (target === 'banner' && $('bnImg')) { $('bnImg').value = r.url; toast('Фото загружено'); }
    else if (target === 'product' && $('pfImage')) { $('pfImage').value = r.url; $('pfPreview').src = r.url; $('pfPreview').classList.remove('hidden'); toast('Фото загружено'); }
    else if ($('bnImg')) { $('bnImg').value = r.url; toast('Фото загружено'); }
    else { S.pendingChatPhoto = r.url; toast('Фото готово — нажмите ➤'); }
  } catch(e){ toast('Не удалось: ' + e.message); }
  ev.target.value='';
}

// ---------- кроппер 1:1 ----------
let cropState = null, cropPointer = null, cropPinch = null;
function startCrop(file, cb){
  if (file.size > 10 * 1024 * 1024) { toast('Файл больше 10 МБ — выберите фото меньше'); return; }
  const rd = new FileReader();
  rd.onload = () => { const img = new Image();
    img.onload = () => { const C = 320; const min = Math.max(C/img.width, C/img.height);
      cropState = { img, cb, min, scale: min, ox: 0, oy: 0, C };
      $('cropZoom').value = 0; $('cropWrap').classList.remove('hidden'); drawCrop(); };
    img.onerror = () => toast('Не удалось открыть фото — попробуйте другое');
    img.src = rd.result; };
  rd.onerror = () => toast('Не удалось прочитать файл');
  rd.readAsDataURL(file);
}
function drawCrop(){
  if (!cropState) return;
  const cv = $('cropCv'), ctx = cv.getContext('2d');
  const { img, scale, ox, oy, C } = cropState;
  ctx.fillStyle = '#F1EBDD'; ctx.fillRect(0, 0, C, C);
  const w = img.width * scale, h = img.height * scale;
  const lim = (v, d) => Math.min(0, Math.max(C - d, v));
  ctx.drawImage(img, lim((C - w)/2 + ox, w), lim((C - h)/2 + oy, h), w, h);
}
function cropZoomSet(v){ if (!cropState) return;
  const oldScale = cropState.scale;
  cropState.scale = cropState.min * (1 + (+v) / 100 * 2.5);
  drawCrop();
}
function cropPanStart(e){ if (!cropState) return; e.preventDefault();
  if (e.touches && e.touches.length === 2) { cropPinch = { d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), s: cropState.scale }; return; }
  const p = e.touches ? e.touches[0] : e;
  cropPointer = { x: p.clientX, y: p.clientY, ox: cropState.ox, oy: cropState.oy };
}
function cropPanMove(e){ if (!cropState || !cropPointer) return; e.preventDefault();
  const p = e.touches ? e.touches[0] : e;
  cropState.ox = cropPointer.ox + (p.clientX - cropPointer.x);
  cropState.oy = cropPointer.oy + (p.clientY - cropPointer.y);
  drawCrop();
}
function cropPanEnd(){ cropPointer = null; cropPinch = null; }
function cropDone(){ if (!cropState) return;
  const C = 1200;
  const oc = document.createElement('canvas'); oc.width = oc.height = C;
  const ctx = oc.getContext('2d');
  const { img, scale, ox, oy, C: c0 } = cropState;
  const k = C / c0;
  ctx.fillStyle = '#F1EBDD'; ctx.fillRect(0, 0, C, C);
  const w = img.width * scale, h = img.height * scale;
  const lim = (v, d) => Math.min(0, Math.max(C - d, v));
  ctx.drawImage(img, lim(((c0 - w)/2 + ox) * k, w*k), lim(((c0 - h)/2 + oy) * k, h*k), w * k, h * k);
  const data = oc.toDataURL('image/jpeg', 0.85);
  $('cropWrap').classList.add('hidden');
  const cb = cropState.cb; cropState = null; cb(data);
}
function cropCancel(){ $('cropWrap').classList.add('hidden'); cropState = null; }
// ---------- конвейер фото ----------
async function uploadB64(dataUrl){
  const r = await api('/admin/upload', { b64: dataUrl.split(',')[1], mime: 'image/jpeg' });
  return r.url;
}
function onPickMulti(ev){
  const files = [...ev.target.files]; ev.target.value = '';
  processMulti(files, 0);
}
async function processMulti(files, i){
  if (i >= files.length) { toast('Фото загружены'); renderPhotoGrid(); return; }
  const left = files.length - i;
  toast('Обрежьте фото ' + (i+1) + ' из ' + files.length + ' (ещё ' + (left-1) + ')');
  startCrop(files[i], async (data) => {
    try { const url = await uploadB64(data); pfImages.push(url); }
    catch(e){ toast('Ошибка загрузки: ' + (e.message||'повторите позже')); }
    processMulti(files, i + 1);
  });
}

async function renderBannersAdm(){ return renderDesign('banners'); }

  <div class="field"><label>Заголовок (RU)</label><input id="bnT" value="${b?escHtml(b.title_ru):''}"></div>
  <div class="field"><label>Подпись (RU)</label><input id="bnS" value="${b?escHtml(b.sub_ru):''}"></div>
  <div class="field"><label>Ссылка на фото (URL или загрузка)</label>
  <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-xs" onclick="S.pickTarget='banner';$('photoFile').click()">🖼 Загрузить</button><input id="bnImg" style="flex:1" value="${b?escHtml(b.image_url):''}"></div></div>
  <img id="pfPreview" class="img-prev ${b&&b.image_url?'':'hidden'}" src="${b?escHtml(b.image_url):''}">
  <button class="btn btn-gold blk" onclick="saveBanner()">💾 Сохранить</button>
  <button class="btn btn-ghost blk" onclick="closeSheet()">Отмена</button>`);

function saveBanner(){ guard(async ()=>{
  const banner = { title_ru:$('bnT').value.trim(), sub_ru:$('bnS').value.trim(), image_url:$('bnImg').value.trim() };
  if (editBannerId) banner.id = editBannerId;
  await api('/admin/banner', { banner }); toast('Баннер сохранён'); closeSheet(); renderBannersAdm();
}); }
async function renderPromos(){
  const ps = await api('/admin/promos');
  $('content').innerHTML = `<button class="btn btn-ghost blk" onclick="TAB='more';renderTabs();render()">← Ещё</button>
  <div class="sect-t">Промокоды</div>
  ${ps.map(p=>`<div class="card row"><div><b class="gold" style="font-size:16px">${p.code}</b><div class="muted" style="font-size:12px">−${p.percent}% ${p.active===false?'· выключен':''}</div></div>
  <button class="btn btn-ghost btn-xs" onclick="api('/admin/promo',{promo:{id:${p.id},active:${p.active===false}} }).then(()=>{toast('Готово');renderPromos()})">${p.active===false?'Включить':'Выключить'}</button>
  <button class="btn btn-del btn-xs" onclick="if(confirm('Удалить?'))api('/admin/promo/delete',{id:${p.id}}).then(renderPromos)">🗑</button></div>`).join('') || '<div class="empty">Промокодов нет</div>'}
  <button class="btn btn-gold blk" onclick="const c=prompt('Код (напр. SAHAR10):');if(c){const p2=prompt('Скидка %:','10');if(p2)api('/admin/promo',{promo:{code:c,percent:Number(p2)}}).then(()=>{toast('Добавлен');renderPromos()})}">＋ Промокод</button>`;
}
function openBroadcast(){
  openSheet(`<div class="serif" style="font-size:19px;font-weight:700">📣 Рассылка</div>
  <p class="muted" style="font-size:12.5px;margin-top:6px">Уйдёт всем клиентам магазина с кнопкой «Открыть магазин».</p>
  <div class="field"><label>Текст сообщения</label><textarea id="bcText" rows="4" placeholder="Новая коллекция трюфелей ✨"></textarea></div>
  <button class="btn btn-gold blk" onclick="doBroadcast()">Отправить всем</button>
  <button class="btn btn-ghost blk" onclick="closeSheet()">Отмена</button>`);
}
function doBroadcast(){
  const text = $('bcText').value.trim(); if (!text) return;
  if (!confirm('Отправить рассылку ВСЕМ клиентам?')) return;
  guard(async ()=>{
    const r = await api('/admin/broadcast', { text }); closeSheet(); toast(`Отправлено: ${r.sent}${r.failed?', не доставлено: '+r.failed:''}`);
  });
}
async function renderSettingsAdm(){
  const r = await api('/admin/settings');
  const s = r.settings || r;
  const CURS = Object.keys(s.rates||{});
  $('content').innerHTML = `<button class="btn btn-ghost blk" onclick="TAB='more';renderTabs();render()">← Ещё</button>
  <div class="sect-t">Курсы валют (за 1 $)</div>
  <div class="card">${CURS.filter(c2=>c2!=='USD').map(c2=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)">
    <b>${c2}</b><input type="number" step="0.1" id="rate_${c2}" value="${s.rates[c2]}" style="width:110px;background:transparent;border:1px solid var(--hair);border-radius:9px;padding:7px 10px;color:var(--text);font:700 14px Manrope"></div>`).join('')}
    <button class="btn btn-gold blk" onclick='saveRates()'>💾 Сохранить курсы</button></div>
  <div class="sect-t">Оплата и доставка по странам</div>
  ${(s.countries||[]).map(c2=>`<div class="card"><b>${c2.flag} ${c2.name_ru} · ${c2.currency}</b>
    <div class="frow" style="margin-top:8px"><div class="field"><label>Курьер $</label><input id="cr_${c2.code}" value="${c2.courier_usd}"></div>
    <div class="field"><label>Почта $</label><input id="po_${c2.code}" value="${c2.postal_usd}"></div>
    <div class="field"><label>Бесплатно от $</label><input id="fr_${c2.code}" value="${c2.free_from_usd}"></div></div></div>`).join('')}
  <button class="btn btn-gold blk" onclick="saveCountries()">💾 Сохранить страны</button>
  <div class="sect-t">Реквизиты оплаты (по странам)</div>
  ${(s.payments||[]).map(p=>`<div class="card">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center">
      <b>${p.title_ru}</b>
      <button id="pact_${p.id}" class="${p.active!==false?'on':''}" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'✓ Включён':'Выключен'" style="padding:8px 12px;border-radius:10px;border:1px solid var(--hair);background:var(--surface);font:700 12px 'Manrope';cursor:pointer;color:var(--text)">${p.active!==false?'✓ Включён':'Выключен'}</button>
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:3px">${(p.countries||[]).join(' · ')}</div>
    <div class="field" style="margin-top:8px"><label>Инструкция / реквизиты</label><textarea id="pin_${p.id}" rows="2">${escHtml(p.instr_ru||'')}</textarea></div>
  </div>`).join('')}
  <button class="btn btn-gold blk" onclick="guard(savePayments)">💾 Сохранить реквизиты</button>
  <div class="sect-t">Анимации витрины</div>
  <div class="card"><div class="kb" id="animKb">${['silk','shimmer','parallax','festive','minimal'].map(a=>`<button class="${s.anim===a?'on':''}" onclick="pickAnim('${a}')">${{silk:'Silk',shimmer:'Golden Shimmer',parallax:'Parallax Luxe',festive:'Festive ✨',minimal:'Minimal'}[a]}</button>`).join('')}</div>
  <div class="muted" style="font-size:12px;margin-top:8px">Живое превью на витрине после сохранения.</div>
  <button class="btn btn-gold blk" onclick="saveAnim()">💾 Применить анимацию</button></div>`;
}
let pendingAnim = null;
async function pickAnim(a){ pendingAnim = a; [...$('animKb').querySelectorAll('button')].forEach(b=>b.classList.remove('on')); event.target.classList.add('on'); }
function saveRates(){ guard(async ()=>{
  const r = await api('/admin/settings'); const s = r.settings || r;
  for (const c2 of Object.keys(s.rates)){ const v = Number($('rate_'+c2) ? $('rate_'+c2).value : s.rates[c2]); if (v>0) s.rates[c2]=v; }
  if (pendingAnim) s.anim = pendingAnim;
  await api('/admin/settings', { settings: s }); toast('Курсы сохранены');
}); }
async function saveAnim(){
  if (!pendingAnim) { toast('Сначала выберите пресет'); return; }
  guard(async ()=>{
    const r = await api('/admin/settings'); const s2 = r.settings || r;
    s2.anim = pendingAnim;
    await api('/admin/settings', { settings: s2 });
    toast('Анимация «'+pendingAnim+'» применена к витрине');
  })();
}
function saveCountries(){ guard(async ()=>{
  const r = await api('/admin/settings'); const s = r.settings || r;
  s.countries = (s.countries||[]).map(c2 => ({ ...c2, courier_usd:Number(($('cr_'+c2.code)||{}).value)||c2.courier_usd||0, postal_usd:Number(($('po_'+c2.code)||{}).value)||c2.postal_usd||0, free_from_usd:Number(($('fr_'+c2.code)||{}).value)||c2.free_from_usd||0 }));
  await api('/admin/settings', { settings: s }); toast('Доставка обновлена');
}); }
async function savePayments(){
  const r = await api('/admin/settings'); const s = r.settings || r;
  s.payments = s.payments.map(p => ({ ...p, instr_ru: ($('pin_'+p.id) ? $('pin_'+p.id).value : p.instr_ru) || '', active: $('pact_'+p.id) ? $('pact_'+p.id).classList.contains('on') : p.active !== false }));
  await api('/admin/settings', { settings: s }); toast('Реквизиты оплаты сохранены');
}
// ---------- вход ----------
(async function(){
  if (tg && tg.initData){
    try {
      const v = await api('/verify');
      $('myId').textContent = 'ID ' + v.user.id;
      if (v.is_owner){ $('panel').classList.remove('hidden'); renderTabs(); render(); return; }
      $('accId').textContent = v.user.id;
    } catch(e){ $('accId').textContent = 'проверка не прошла'; }
  } else {
    $('accId').textContent = 'откройте из Telegram';
  }
  $('noAccess').classList.remove('hidden');
})();
</script>
