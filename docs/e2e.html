<!DOCTYPE html><html><head><meta charset="utf-8"><title>E2E</title></head>
<body style="font-family:monospace;padding:16px;white-space:pre-wrap" id="out">running...</body>
<script>
const API = 'https://sahar-shop.dostonravshanov1006800.workers.dev';
const INIT_OWNER = 'auth_date=1792474600&query_id=AAtest_owner&user=%7B%22id%22%3A6999767433%2C%22first_name%22%3A%22%5Cu0414%5Cu043e%5Cu0441%5Cu0442%5Cu043e%5Cu043d%22%2C%22username%22%3A%22dostonravshanov%22%2C%22language_code%22%3A%22ru%22%7D&hash=24a6fb1c0d99d06af88360d8142cfbc8e210135076812df2c2800a57d350ba24';
const INIT_CLIENT = 'auth_date=1792474600&query_id=AAtest_client&user=%7B%22id%22%3A111222333%2C%22first_name%22%3A%22%5Cu0422%5Cu0435%5Cu0441%5Cu0442%5Cu043e%5Cu0432%5Cu044b%5Cu0439%20%5Cu043a%5Cu043b%5Cu0438%5Cu0435%5Cu043d%5Cu0442%22%7D&hash=43d1e6b8a3f008f0be91e4657f815a32c3ea86f2a39cb4e5547e443c6454aafe';
const log = [];
function out(l){ log.push(l); document.getElementById('out').textContent = log.join('\n'); }
async function api(path, initData, extra) {
  const r = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData, ...(extra||{}) }) });
  return { status: r.status, j: await r.json().catch(()=>null) };
}
async function get(path) {
  const r = await fetch(API + path);
  return { status: r.status, j: await r.json().catch(()=>null) };
}
(async () => {
  try {
    const c = (await get('/api/catalog')).j;
    out('1) каталог: товаров=' + c.products.length + ' категорий=' + c.categories.length);
    const vo = await api('/api/verify', INIT_OWNER);
    out('2) verify владелец: is_admin=' + vo.j.is_admin + ' id=' + vo.j.user.telegram_id);
    const vc = await api('/api/verify', INIT_CLIENT);
    out('3) verify клиент: is_admin=' + vc.j.is_admin + ' id=' + vc.j.user.telegram_id);
    const bad = await api('/api/verify', 'user=x&hash=fake');
    out('4) подделка отклонена: status=' + bad.status + ' (ожидаем 401)');
    const prod = c.products[0];
    const ord = await api('/api/order', INIT_CLIENT, { items: [{ id: prod.id, qty: 2 }], address: 'Ташкент, тест 1', phone: '+998901234567', comment: 'E2E тест', payment_method: 'cash' });
    out('5) заказ клиента: status=' + ord.status + ' ответ=' + JSON.stringify(ord.j));
    const my = await get('/api/my/orders?initData=' + encodeURIComponent(INIT_CLIENT));
    out('6) мои заказы: status=' + my.status + ' всего=' + (Array.isArray(my.j) ? my.j.length : JSON.stringify(my.j).slice(0,80)));
    const sup = await api('/api/support', INIT_CLIENT, { text: 'Привет! Это тест поддержки ✅' });
    out('7) поддержка: status=' + sup.status);
    const thread = await get('/api/support?initData=' + encodeURIComponent(INIT_CLIENT));
    out('8) тред поддержки: сообщений=' + (thread.j.messages ? thread.j.messages.length : JSON.stringify(thread.j).slice(0,80)));
    const ao = await get('/api/admin/orders?initData=' + encodeURIComponent(INIT_OWNER));
    const olist = ao.j;
    out('9) админ заказы: status=' + ao.status + ' всего=' + (Array.isArray(olist) ? olist.length : 'ERR'));
    let last = Array.isArray(olist) && olist[0];
    if (last) {
      out('   последний: #' + last.id + ' сумма=' + last.total + ' клиент=' + last.client.telegram_id + ' статус=' + last.status);
      const st = await api('/api/admin/order', INIT_OWNER, { order_id: last.id, status: 'accepted' });
      out('10) смена статуса на принят: status=' + st.status + ' ' + JSON.stringify(st.j));
      const ao2 = await get('/api/admin/orders?initData=' + encodeURIComponent(INIT_OWNER));
      out('11) статус в базе теперь: ' + (ao2.j[0] ? ao2.j[0].status : '?'));
    }
    const forbidden = await get('/api/admin/orders?initData=' + encodeURIComponent(INIT_CLIENT));
    out('12) клиент НЕ видит админ-заказы: status=' + forbidden.status + ' (ожидаем 403)');
    const allp = await get('/api/products?all=1&initData=' + encodeURIComponent(INIT_OWNER));
    out('13) админ товары (все): ' + (Array.isArray(allp.j) ? allp.j.length : allp.status));
    out('=== E2E ЗАВЕРШЁН ===');
  } catch (e) { out('ОШИБКА: ' + e); }
})();
</script></body></html>
