<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SAHAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --sand:#F1EBDD; --text:#231A10; --muted:#7A6A55;
  --gold1:#C9A24B; --gold2:#A67C2E; --hairline:#D9C48F; --sand-soft:#F5F0E4;
  --ok:#3E7B5A; --err:#B3483B; --shadow:0 10px 30px rgba(35,26,16,.10); --chip:#FFFFFF;
}
[data-theme="dark"]{
  --bg:#14100B; --surface:#1E1812; --sand:#241D14; --text:#F5EFE4; --muted:#A08D74;
  --gold1:#C9A24B; --gold2:#A67C2E; --hairline:#3A3021; --sand-soft:#241D14;
  --ok:#5FA37E; --err:#C96A5D; --shadow:0 10px 30px rgba(0,0,0,.45); --chip:#1E1812;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
.serif{font-family:'Playfair Display',serif}
.hidden{display:none!important}
::-webkit-scrollbar{display:none}
/* ---- анимации: пресеты ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{transform:translateX(-130%)}100%{transform:translateX(230%)}}
@keyframes floatGold{0%{transform:translateY(0) scale(1);opacity:0}12%{opacity:.9}100%{transform:translateY(-130px) scale(.4);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
[data-anim="silk"] .anim,[data-anim="shimmer"] .anim,[data-anim="parallax"] .anim,[data-anim="festive"] .anim{animation:fadeUp .45s ease both}
[data-anim="minimal"] *{animation:none!important;transition:none!important}
[data-anim="minimal"] .anim{opacity:1;transform:none}
.btn-gold{position:relative;overflow:hidden}
[data-anim="shimmer"] .btn-gold::after,[data-anim="shimmer"] .price-gold::after{content:'';position:absolute;top:0;left:0;height:100%;width:38%;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);animation:shimmer 2.8s ease-in-out infinite}
[data-anim="festive"] #main::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(circle 2px at 12% 78%,#D9C48F 45%,transparent 50%),radial-gradient(circle 1.6px at 30% 92%,#C9A24B 45%,transparent 50%),
  radial-gradient(circle 2.2px at 55% 84%,#E8D9A8 45%,transparent 50%),radial-gradient(circle 1.4px at 74% 90%,#C9A24B 45%,transparent 50%),
  radial-gradient(circle 2px at 90% 80%,#D9C48F 45%,transparent 50%);
  animation:floatGold 7s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---- каркас ---- */
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:92px}
#main{padding:0 16px 24px}
header{position:sticky;top:0;z-index:40;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{line-height:1}
.brand .logo{font-size:26px;font-weight:900;letter-spacing:.04em}
.brand .sub{font-size:8.5px;font-weight:700;letter-spacing:.32em;color:var(--gold2);text-transform:uppercase;margin-top:3px}
.goldtext{background:linear-gradient(120deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:44px;height:44px;border:none;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:var(--shadow)}
.badge-n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.chip-country{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:14px;background:var(--chip);font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow);border:1px solid var(--hairline)}
/* поиск */
.search{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:0 14px;height:46px}
.search:focus-within{border-color:var(--gold1);box-shadow:0 0 0 1px var(--gold1)}
.search input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font:600 14px 'Manrope'}
.search svg{flex:none}
/* баннеры */
#banners{margin:14px -16px 0;overflow:hidden;scroll-snap-type:x mandatory;display:flex;overflow-x:auto}
.banner{flex:none;width:100%;scroll-snap-align:center;position:relative;border-radius:20px;overflow:hidden;height:150px}
.banner img{width:100%;height:100%;object-fit:cover}
.banner .btext{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 14px;background:linear-gradient(transparent,rgba(20,16,11,.82));color:#fff}
.banner .bt{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;line-height:1.2}
.banner .bs{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E8D9A8;margin-top:3px}
[data-anim="parallax"] .banner img{will-change:transform}
/* чипы категорий */
#chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 4px}
.chip{flex:none;padding:9px 16px;border-radius:13px;background:var(--chip);border:1px solid var(--hairline);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(120deg,var(--gold1),var(--gold2));border-color:transparent;color:#fff}
/* секции и сетка */
.sect{margin-top:22px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between}
.sect-t{font-family:'Playfair Display',serif;font-size:21px;font-weight:700}
.sect-s{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .2s}
.card:active{transform:scale(.97)}
.card .ph{position:relative;aspect-ratio:4/5;background:var(--sand)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-skel{width:100%;height:100%;background:linear-gradient(100deg,var(--sand) 40%,var(--sand-soft) 50%,var(--sand) 60%);background-size:200% 100%;animation:skel 1.2s infinite}
@keyframes skel{to{background-position:-200% 0}}
.tags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.94);color:var(--gold2)}
.tag.t-gold{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qadd{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:11px;border:none;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(166,124,46,.4)}
.card .info{padding:11px 13px 13px}
.card .nm{font-weight:800;font-size:13.5px;line-height:1.28;min-height:36px}
.card .wt{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.price-row{display:flex;align-items:baseline;gap:7px;margin-top:7px}
.price-gold{position:relative;font-family:'Playfair Display',serif;font-size:16.5px;font-weight:700;overflow:hidden;background:linear-gradient(120deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.oldp{font-size:11.5px;color:var(--muted);text-decoration:line-through;font-weight:600}
.disc{font-size:10px;font-weight:800;color:var(--gold2)}
/* пустые состояния */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .e-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--text);font-weight:700}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,11,.45);z-index:60;opacity:0;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:24px 24px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--hairline);margin:10px auto 2px}
.sheet-pad{padding:6px 20px 8px}
.sh-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700}
/* оверлей-экран (заказы, чекаут, страна) */
.ovl{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 120px;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.ovl.open{transform:none}
.ovl-back{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
.ovl-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700}
/* формы */
.field{background:var(--surface);border:1px solid var(--hairline);border-radius:15px;padding:11px 15px;margin-top:11px}
.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:none;outline:none;background:transparent;color:var(--text);font:600 15px 'Manrope'}
.field textarea{resize:none}
.opt{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--surface);border:1.5px solid transparent;border-radius:15px;margin-top:9px;cursor:pointer}
.opt.on{border-color:var(--gold1);background:var(--surface)}
.radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--hairline);flex:none}
.opt.on .radio{border-color:var(--gold1);background:radial-gradient(circle,var(--gold1) 0 5px,transparent 6px)}
/* кнопки */
.btn{width:100%;border:none;border-radius:15px;padding:15px;font:800 15px 'Manrope';letter-spacing:.02em;cursor:pointer}
.btn-gold{background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;box-shadow:0 8px 20px rgba(166,124,46,.35)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--hairline)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{padding:10px 16px;font-size:13px;width:auto}
/* toast */
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:13px;font-weight:700;font-size:13px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:82%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* нижняя навигация */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--hairline);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);transition:transform .2s}
nav.kb{transform:translateY(110%)}
.nav-in{display:flex;width:100%;max-width:430px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;border:none;background:transparent}
.tab.on{color:var(--gold2)}
.tab .tic{font-size:20px;line-height:1}
/* корзина-шторка, строки */
.cline{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hairline)}
.cline:last-child{border-bottom:none}
.cline img{width:58px;height:58px;border-radius:13px;object-fit:cover;flex:none}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--hairline);border-radius:11px;overflow:hidden;flex:none}
.qty button{width:32px;height:32px;border:none;background:transparent;color:var(--text);font-size:17px;font-weight:700;cursor:pointer}
.qty span{width:28px;text-align:center;font-weight:800;font-size:13px}
/* шаги чекаута */
.steps{display:flex;gap:6px;margin:10px 0 4px}
.stepdot{flex:1;height:3.5px;border-radius:2px;background:var(--hairline)}
.stepdot.on{background:linear-gradient(120deg,var(--gold1),var(--gold2))}
/* чат */
#chatBox{display:flex;flex-direction:column;gap:8px;padding:6px 0 16px}
.bub{max-width:82%;padding:9px 14px;border-radius:17px;font-size:14px;font-weight:600;animation:fadeUp .25s ease}
.bub.me{align-self:flex-end;background:var(--text);color:var(--bg);border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--hairline);border-bottom-left-radius:5px}
.bub .bt{font-size:9.5px;color:var(--muted);margin-top:3px;font-weight:700}
.bub img{max-width:180px;border-radius:11px;margin-top:6px;display:block}
.qr-chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}
.qr-chip{flex:none;padding:8px 13px;background:var(--surface);border:1px solid var(--gold1);color:var(--gold2);border-radius:12px;font-size:12.5px;font-weight:700;cursor:pointer}
.chat-input{display:flex;gap:8px;padding:10px 0 4px;position:sticky;bottom:0;background:var(--bg)}
.chat-input input{flex:1;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:0 15px;height:46px;color:var(--text);font:600 14px 'Manrope';outline:none}
.chat-input button{width:46px;height:46px;border-radius:14px;border:none;background:linear-gradient(120deg,var(--gold1),var(--gold2));color:#fff;font-size:18px;cursor:pointer}
/* профиль */
.prow{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--hairline);border-radius:15px;padding:14px 16px;margin-top:10px;cursor:pointer}
.prow .pl{font-weight:800;font-size:13.5px}
.prow .pv{color:var(--muted);font-weight:700;font-size:13px}
/* успех */
.success-wrap{text-align:center;padding:60px 24px 20px}
.check-gold{width:86px;height:86px;border-radius:50%;background:linear-gradient(120deg,var(--gold1),var(--gold2));display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .5s ease both;color:#fff}
.onum{font-family:'Playfair Display',serif;font-size:34px;font-weight:900;margin-top:18px}
/* прогресс доставки */
.dprog{background:var(--sand);border-radius:12px;padding:11px 13px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.dbar{height:5px;border-radius:3px;background:var(--hairline);margin-top:8px;overflow:hidden}
.dbar>div{height:100%;background:linear-gradient(120deg,var(--gold1),var(--gold2));border-radius:3px;transition:width .3s}
/* заказы: статусы */
.st-pill{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:9px;letter-spacing:.04em}
.st-new{background:var(--sand);color:var(--muted)} .st-confirmed,.st-paid{background:#EBF3EC;color:var(--ok)}
.st-packing,.st-shipping{background:#F7EEDC;color:var(--gold2)} .st-delivered{background:#EBF3EC;color:var(--ok)}
.st-cancelled,.st-refunded{background:#F6E7E4;color:var(--err)} .st-awaiting_payment{background:#F7EEDC;color:var(--gold2)}
.tl{margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.tl div{padding:2px 0}
</style>
</head>
<body data-anim="silk">
<div id="app">
  <header>
    <div class="hrow">
      <div class="brand"><div class="logo serif goldtext">SAHAR</div><div class="sub">Премиальные сладости</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="chip-country" onclick="openCountrySheet()"><span id="cFlag">🇷🇺</span><span id="cCode">RU</span></div>
        <button class="icon-btn" onclick="openCart()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="badge-n hidden" id="cartN">0</span>
        </button>
      </div>
    </div>
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A67C2E" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" placeholder="Найти трюфели, наборы, шоколад…" oninput="onSearch()">
    </div>
  </header>
  <div id="main">
    <div id="banners"></div>
    <div id="chips"></div>
    <div id="sections"></div>
  </div>
</div>

<!-- product sheet -->
<div class="sheet-bg hidden" id="psBg" onclick="closeSheet('ps')"></div>
<div class="sheet" id="ps"><div class="grab"></div><div class="sheet-pad" id="psBody"></div></div>
<!-- cart sheet -->
<div class="sheet-bg hidden" id="cartBg" onclick="closeSheet('cart')"></div>
<div class="sheet" id="cart"><div class="grab"></div><div class="sheet-pad" id="cartBody"></div></div>
<!-- country sheet -->
<div class="sheet-bg hidden" id="csBg" onclick="closeSheet('cs')"></div>
<div class="sheet" id="cs"><div class="grab"></div><div class="sheet-pad" id="csBody"></div></div>

<!-- overlay экраны -->
<div class="ovl" id="ovlGeneric"><div class="ovl-back" onclick="closeOvl()">← <span id="ovlBackT">Назад</span></div><div id="ovlBody"></div></div>

<nav><div class="nav-in" id="navIn"></div></nav>
<div id="toast"></div>
<input type="file" id="photoFile" accept="image/*" class="hidden" onchange="onPhotoPicked(event)">

<script>

if (tg) { tg.ready(); tg.expand(); }
const API = 'https://sahar-shop.dostonravshanov1006800.workers.dev';

let DEMO = false;

const S = { settings:{rates:{USD:1},rounding:{USD:1},countries:[],payments:[],shop_open:true,anim:'silk',haptic:true},
  cats:[], prods:[], banners:[], cart:{}, fav:[], lang:'ru', country:null, view:'shop', cat:0, q:'', productId:null, checkout:null, chatTid:0, chatTimer:null };

// ---------- утилиты ----------
function escHtml(x){ return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function money(usd){
  const cur = S.country ? S.country.currency : 'USD';
  const r = S.settings.rates[cur] || 1;
  let v = usd * r * (1 + ((S.settings.markup||{})[S.country ? S.country.code : ''] || 0) / 100);
  const step = S.settings.rounding[cur] || 1;
  v = Math.round(v / step) * step;
  const sym = {USD:'$',RUB:'₽',KZT:'₸',UZS:'сўм',BYN:'Br',KGS:'с',AMD:'֏',GEL:'₾',AZN:'₼',TJS:'SM',MDL:'L'}[cur] || cur;
  return v.toLocaleString('ru-RU').replace(/\u00A0/g,' ') + ' ' + sym;
}
function usd(v){ return '$' + (Math.round(v*100)/100).toLocaleString('en-US'); }
async function api(path, body){
  const init = tg && tg.initData ? { initData: tg.initData } : {};
  const r = await fetch(API + '/api' + path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ...init, ...body }) } : undefined);
  if (!r.ok) { const e = await r.json().catch(()=>({})); const err = new Error(e.error || 'network'); err.code = r.status; throw err; }
  return r.json();
}
function save(){ localStorage.setItem('sahar_v6', JSON.stringify({ cart:S.cart, fav:S.fav, lang:S.lang, country:S.country ? S.country.code : null, theme:S.theme||'auto' })); }
function loadLocal(){
  try { const d = JSON.parse(localStorage.getItem('sahar_v6') || '{}');
    S.cart = d.cart || {}; S.fav = d.fav || []; S.lang = d.lang || 'ru'; S.theme = d.theme || 'auto';
    if (d.country) { const c = S.settings.countries.find(x=>x.code===d.country); if (c) S.country = c; }
  } catch(e){}
}

// ---------- тема ----------
function applyTheme(){
  let dark = S.theme === 'dark';
  if (S.theme === 'auto' || !S.theme) dark = tg ? tg.colorScheme === 'dark' : false;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (tg && tg.setHeaderColor) try { tg.setHeaderColor(dark ? '#14100B' : '#FAF8F3'); tg.setBackgroundColor(dark ? '#14100B' : '#FAF8F3'); } catch(e){}
}

// ---------- загрузка ----------
async function boot(){
  const lc = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || '';
  if (lc.startsWith('uz')) S.lang = 'uz'; else if (lc.startsWith('en')) S.lang = 'en'; else S.lang = localStorage.getItem('sahar_lang') || 'ru';
  const [settings, catalog] = await Promise.all([
    fetchSettings(),
    fetch(API + '/api/catalog').then(r=>r.json()).catch(()=>({})),
  ]);
  S.settings = Object.assign(S.settings, settings);
  S.cats = catalog.categories || []; S.prods = catalog.products || []; S.banners = catalog.banners || [];
  document.body.setAttribute('data-anim', S.settings.anim || 'silk');
  loadLocal();
  if (!S.country) S.country = S.settings.countries.find(c=>c.code==='RU') || S.settings.countries[0] || null;
  applyTheme(); applyLang();
  renderNav(); renderCountry(); renderBanners(); renderChips(); renderSections(); updateCartBadge();
  if (!tg || !tg.initData) { DEMO = true; toast('Откройте магазин из Telegram для полного доступа'); }
  if (!localStorage.getItem('sahar_country_seen')) { localStorage.setItem('sahar_country_seen','1'); openCountrySheet(); }
  // MainButton для чекаута
  if (tg && tg.MainButton) { tg.MainButton.offClick(mainConfirm); tg.MainButton.onClick(mainConfirm); }
}
async function fetchSettings(code){
  const r = await fetch(API + '/api/settings' + (code ? '?country=' + code : '')).catch(()=>null);
  if (!r) return {};
  const j = await r.json().catch(()=>({}));
  S.settings = Object.assign(S.settings, j);
  return j;
}
function applyLang(){ $('q').placeholder = t('srch'); }

}

}

}
function renderChips(){
  $('chips').innerHTML = `<button class="chip ${S.cat===0?'on':''}" onclick="pickCat(0)">${t('all')}</button>` +
    S.cats.map(c=>`<button class="chip ${S.cat===c.id?'on':''}" onclick="pickCat(${c.id})">${S.lang==='en'?c.name_en:(S.lang==='uz'?c.name_uz:c.name_ru)}</button>`).join('');
}
function pickCat(id){ haptic(); S.cat=id; renderChips(); renderSections(); }
function onSearch(){ S.q = $('q').value.trim().toLowerCase(); renderSections(); }
function pname(p){ return S.lang==='en' ? (p.name_en||p.name_ru) : S.lang==='uz' ? (p.name_uz||p.name_ru) : p.name_ru; }
function pdesc(p){ return S.lang==='en' ? (p.desc_en||p.desc_ru) : S.lang==='uz' ? (p.desc_uz||p.desc_ru) : p.desc_ru; }
function badgeHtml(b){ const m={hit:['Хит','t-gold'],new:['Новинка',''],premium:['Premium','t-gold'],limited:['Ограниченная серия','']};
  return m[b]?`<span class="tag ${m[b][1]}">${m[b][0]}</span>`:''; }
function cardHtml(p){
  const d = p.old_price_usd && p.old_price_usd > p.price_usd ? Math.round((1-p.price_usd/p.old_price_usd)*100) : 0;
  return `<div class="card anim" onclick="openProduct(${p.id})">
    <div class="ph"><img src="${p.image_url||PH}" loading="lazy" alt="">
      <div class="tags">${(p.badges||[]).map(badgeHtml).join('')}</div>
      <button class="heart" onclick="event.stopPropagation();toggleFav(${p.id})">${S.fav.includes(p.id)?'🧡':'🤍'}</button>
      ${p.stock>0?`<button class="qadd" onclick="event.stopPropagation();addToCart(${p.id},1)">+</button>`:''}
    </div>
    <div class="info">
      <div class="nm">${pname(p)}</div>
      ${p.weight?`<div class="wt">${p.weight}</div>`:''}
      <div class="price-row"><span class="price-gold">${money(p.price_usd)}</span>${d?`<span class="oldp">${money(p.old_price_usd)}</span><span class="disc">−${d}%</span>`:''}</div>
    </div></div>`;
}
function filtered(){
  return S.prods.filter(p => (S.cat===0 || p.cat===S.cat) && (!S.q || (pname(p)+' '+pdesc(p)).toLowerCase().includes(S.q)) && (!S.q || S.view!=='fav'));
}
function renderSections(){
  if (S.view==='fav'){
    const items = S.prods.filter(p=>S.fav.includes(p.id));
    $('sections').innerHTML = `<div class="sect"><div class="sect-t">${t('fav')}</div><div class="grid">${items.map(cardHtml).join('') || `<div class="empty" style="grid-column:1/3"><div class="e-title">${t('favEmpty')}</div></div>`}</div></div>`;
    return;
  }
  const hits = S.prods.filter(p=>(p.badges||[]).includes('hit'));
  const news = S.prods.filter(p=>(p.badges||[]).includes('new'));
  const sets = S.prods.filter(p=>String(p.cat)===String(S.cats.find(c=>(c.name_ru||'').includes('набор')||(c.name_en||'').includes('set'))?.id));
  let html = '';
  if (!S.q && S.cat===0){
    if (hits.length) html += `<div class="sect"><div class="sect-h"><div class="sect-t">${t('hits')}</div><div class="sect-s">SAHAR</div></div><div class="grid">${hits.map(cardHtml).join('')}</div></div>`;
    const viewedIds = JSON.parse(localStorage.getItem('sahar_viewed') || '[]');
    const viewed = viewedIds.map(id=>S.prods.find(x=>x.id===id)).filter(Boolean).slice(0,4);
    if (viewed.length >= 2) html += `<div class="sect"><div class="sect-t">Недавно смотрели</div><div class="grid">${viewed.map(cardHtml).join('')}</div></div>`;
    if (news.length) html += `<div class="sect"><div class="sect-t">${t('news')}</div><div class="grid">${news.map(cardHtml).join('')}</div></div>`;
    if (sets.length) html += `<div class="sect"><div class="sect-t">${t('sets')}</div><div class="grid">${sets.map(cardHtml).join('')}</div></div>`;
  }
  const catObj = S.cats.find(c=>c.id===S.cat);
  const catName = S.cat===0 ? t('all') : (catObj ? (S.lang==='en'?catObj.name_en:(S.lang==='uz'?catObj.name_uz:catObj.name_ru)) : '');
  html += `<div class="sect"><div class="sect-t">${S.q?'"'+$('q').value+'"':catName}</div><div class="grid">${filtered().map(cardHtml).join('') || `<div class="empty" style="grid-column:1/3"><div class="e-title">${t('cartEmpty')}</div></div>`}</div></div>`;
  $('sections').innerHTML = html;
}

// ---------- корзина ----------
function addToCart(pid, qty){
  if (!S.settings.shop_open && S.settings.shop_open!==undefined) { toast('Магазин временно закрыт'); return; }
  haptic(); S.cart[pid] = (S.cart[pid]||0) + qty; save(); updateCartBadge(); toast(t('added'));
  closeSheet('ps'); openCart();
}
function setQty(pid, n){ if (n<=0) delete S.cart[pid]; else S.cart[pid]=n; save(); updateCartBadge(); renderCart(); }
function cartItems(){ return Object.entries(S.cart).map(([id,qty])=>({ p:S.prods.find(x=>x.id==id), qty })).filter(x=>x.p); }
function cartTotal(){ return cartItems().reduce((s,x)=>s+x.p.price_usd*x.qty,0); }
function updateCartBadge(){ const n = Object.values(S.cart).reduce((a,b)=>a+b,0); const el=$('cartN'); el.textContent=n; el.classList.toggle('hidden', n===0); }
function toggleFav(pid){ haptic(); const i=S.fav.indexOf(pid); if (i>=0) S.fav.splice(i,1); else S.fav.push(pid); save(); renderSections(); if(!$('ps').classList.contains('open')){}else openProduct(pid); }
function openCart(){
  if (!Object.keys(S.cart).length){ toast(t('cartEmpty')); return; }
  renderCart(); openSheet('cart');
}

    </div>`).join('')}
    <div class="dprog">${sub<free? t('freeFrom2').replace('{n}', usd(free-sub)) : '✨ ' + t('free')}

    <div class="field"><label>${t('giftCard')}</label><textarea id="giftCard" rows="2" placeholder="…"></textarea></div>
    <label class="opt" onclick="this.classList.toggle('on');S.giftPack=this.classList.contains('on')"><span>${t('giftPack')}</span><span class="radio"></span></label>
    <label class="opt" onclick="this.classList.toggle('on');S.anon=this.classList.contains('on')"><span>${t('anon')}</span><span class="radio"></span></label>
    <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:16px"><span>${t('total')}</span><span class="price-gold" style="font-size:19px">${money(sub + (S.giftPack?3:0))}</span></div>
    <button class="btn btn-gold" style="margin-top:14px" onclick="startCheckout()">${t('checkout')}</button>`;
}

// ---------- чекаут 3 шага ----------
function startCheckout(){
  closeSheet('cart');
  S.checkout = { step:1, name:(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'', phone:'', comment:'', city:'', address:'', delivery:'courier', payment:'cash', agree:false, idem:crypto.randomUUID() };
  openOvl(t('checkout'), renderCheckoutStep());
}
function renderCheckoutStep(){
  const c = S.country || {}; const ck = S.checkout;
  const steps = `<div class="steps">${[1,2,3].map(i=>`<div class="stepdot ${ck.step>=i?'on':''}"></div>`).join('')}</div>`;
  let html = steps;
  if (ck.step===1){
    html += `<h3 class="ovl-title" style="font-size:20px">${t('step1')}</h3>
      <div class="field"><label>${t('name')}</label><input id="ckName" value="${ck.name}"></div>
      <div class="field"><label>${t('phone')}</label><input id="ckPhone" value="${ck.phone}" inputmode="tel" placeholder="+7 900 000-00-00"></div>
      ${tg&&tg.requestContact?`<button class="btn btn-ghost" style="margin-top:11px" onclick="sharePhone()">${t('sharePhone')}</button>`:''}
      <div class="field"><label>${t('comment')}</label><textarea id="ckComment" rows="2">${ck.comment}</textarea></div>
      <button class="btn btn-gold" style="margin-top:16px" onclick="ckStep(2)">Далее →</button>`;
  } else if (ck.step===2){
    const courier = c.courier_usd||0, postal = c.postal_usd||0, free = c.free_from_usd||Infinity;
    const sub = cartTotal() + (S.giftPack?3:0);
    html += `<h3 class="ovl-title" style="font-size:20px">${t('step2')}</h3>
      <div class="field" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="closeOvl();openCountrySheet()"><label style="margin:0">${t('country')}</label><div style="font-weight:800">${c.flag||''} ${c.name_ru||''} · <span style="color:var(--gold2)">изменить</span></div></div>
      <div class="field"><label>${t('city')}</label><input id="ckCity" value="${ck.city}"></div>
      <div class="field"><label>${t('address')}</label><input id="ckAddr" value="${ck.address}"></div>
      <div class="opt ${ck.delivery==='courier'?'on':''}" onclick="ck.delivery='courier';renderCheckoutStep()"><div><div style="font-weight:800">${t('courier')}</div><div style="font-size:12px;color:var(--muted)">${c.days||''}</div></div><div style="font-weight:800" class="price-gold">${sub>=free?t('free'):money(courier)}</div><span class="radio"></span></div>
      <div class="opt ${ck.delivery==='postal'?'on':''}" onclick="ck.delivery='postal';renderCheckoutStep()"><div><div style="font-weight:800">${t('postal')}</div><div style="font-size:12px;color:var(--muted)">${t('delivery')} · трек-номер</div></div><div style="font-weight:800" class="price-gold">${sub>=free?t('free'):money(postal)}</div><span class="radio"></span></div>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" style="flex:0 0 90px" onclick="ckStep(1)">←</button><button class="btn btn-gold" style="flex:1" onclick="ckStep(3)">Далее →</button></div>`;
  } else {
    const pays = (S.settings.payments||[]).filter(p=>p.active!==false && (S.country?p.countries.includes(S.country.code):true));
    const pm = pays.find(p=>p.id===ck.payment) || pays[0];
    if (pm) ck.payment = pm.id;
    html += `<h3 class="ovl-title" style="font-size:20px">${t('step3')}</h3>
      ${pays.map(p=>`<div class="opt ${ck.payment===p.id?'on':''}" onclick="ck.payment='${p.id}';renderCheckoutStep()"><span style="font-weight:800">${p.title_ru}</span><span class="radio"></span></div>`).join('')}
      ${pm?`<div class="dprog" style="margin-top:14px">${pm.instr_ru||''}</div>`:''}
      <label class="opt" onclick="event.preventDefault();this.classList.toggle('on');S.checkout.agree=this.classList.contains('on');updateMainBtn()"><span style="font-size:13px">${t('agree')} <span style="color:var(--gold2);text-decoration:underline" onclick="event.stopPropagation();openLegal('offer')">оферта</span></span><span class="radio"></span></label>
      <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline)"><span>${t('total')}</span><span class="price-gold" style="font-size:19px">${money(checkoutTotal())}</span></div>`;
    if (tg && tg.MainButton){ tg.MainButton.setText(t('confirm')); updateMainBtn(); }
  }
  return html;
}
function checkoutTotal(){
  const c=S.country||{}; const sub=cartTotal()+(S.giftPack?3:0);
  const ship = sub >= (c.free_from_usd||Infinity) ? 0 : (S.checkout.delivery==='postal'?c.postal_usd:c.courier_usd)||0;
  return sub + ship;
}
function updateMainBtn(){ if (tg && tg.MainButton){ if (S.checkout && S.checkout.step===3 && S.checkout.agree) { tg.MainButton.show(); } else tg.MainButton.hide(); } }
function sharePhone(){ if (tg) tg.requestContact((ok, d)=>{ if (ok && d && d.contact && d.contact.phone_number){ S.checkout.phone = d.contact.phone_number; renderOvl(); } }); }
function ckStep(n){
  const ck=S.checkout;
  if (n===2){ ck.name=$('ckName')?$('ckName').value:ck.name; ck.phone=$('ckPhone')?$('ckPhone').value:ck.phone; ck.comment=$('ckComment')?$('ckComment').value:ck.comment;
    if (!ck.name.trim() || !ck.phone.trim()) { toast(t('name')+' / '+t('phone')); return; } }
  if (n===3){ ck.city=$('ckCity')?$('ckCity').value:ck.city; ck.address=$('ckAddr')?$('ckAddr').value:ck.address;
    if (!ck.city.trim() || !ck.address.trim()) { toast(t('city')+' / '+t('address')); return; } }
  ck.step=n; renderOvl(); window.scrollTo(0,0);
}
function mainConfirm(){ if (S.checkout && S.checkout.step===3 && S.checkout.agree) submitOrder(); }

async function submitOrder(){
  if (DEMO) { toast('Откройте магазин из Telegram'); return; }
  const ck = S.checkout;
  if (!ck.agree) { toast(t('agree')); return; }
  if (tg && tg.MainButton) { tg.MainButton.showProgress(true); }
  try {
    const items = cartItems().map(x=>({ id:x.p.id, qty:x.qty }));
    const r = await api('/order', { items, name:ck.name, phone:ck.phone, comment:ck.comment, country:S.country.code, city:ck.city, address:ck.address, delivery:ck.delivery, payment_method:ck.payment, promo:S.promo||'', gift:{ premium_pack: !!S.giftPack, card: ($('giftCard')?$('giftCard').value:''), anonymous: !!S.anon }, idem_key: ck.idem });
    if (tg && tg.MainButton) tg.MainButton.hideProgress();
    if (r.ok){
      S.cart = {}; S.promo=''; S.giftPack=false; S.anon=false; save(); updateCartBadge();
      ck.idem = crypto.randomUUID();
      $('ovlBody').innerHTML = `<div class="success-wrap">
        <div class="check-gold"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="onum">№${r.order_id}</div>
        <div class="serif" style="font-size:19px;margin-top:6px">${t('successT')}</div>
        <p style="color:var(--muted);font-weight:600;margin-top:6px">${t('successS')}</p>
        <button class="btn btn-gold" style="margin-top:22px" onclick="openOrders()">${t('myOrders')}</button>
        <button class="btn btn-ghost" style="margin-top:10px" onclick="closeOvl();S.view='chat';renderNav();openChatView()">${t('writeOwner')}</button>
      </div>`;
      $('ovlBackT').textContent = t('shop');
      window.scrollTo(0,0);
    } else { toast(r.error==='shop_closed'?'Магазин временно закрыт':t('net')); }
  } catch(e){ if (tg && tg.MainButton) tg.MainButton.hideProgress(); toast(e && e.message==='bad_country'?t('country'):t('net')); }
}

// ---------- overlay-экран ----------
function openOvl(title, html){ $('ovlBackT').textContent = t('shop'); $('ovlBody').innerHTML = `<h2 class="ovl-title" style="display:none">${title}</h2>` + html; $('ovlGeneric').classList.add('open'); }
function renderOvl(){ $('ovlBody').innerHTML = renderCheckoutStep(); updateMainBtn(); }
function closeOvl(){
  $('ovlGeneric').classList.remove('open');
  if (tg && tg.MainButton) tg.MainButton.hide();
  if (S.chatTimer){ clearInterval(S.chatTimer); S.chatTimer=null; }
  if (S.view==='chat'||S.view==='profile'){ S.view='shop'; renderNav(); renderSections(); }
}

// ---------- мои заказы ----------
async function openOrders(){
  $('ovlBackT').textContent = t('profile');
  $('ovlBody').innerHTML = '<div class="empty">' + t('net') + '</div>';
  $('ovlGeneric').classList.add('open');
  try {
    const orders = await api('/my/orders?initData=' + encodeURIComponent(tg.initData));
    const stl = s => ({new:'st-new',awaiting_payment:'st-awaiting_payment',paid:'st-paid',confirmed:'st-paid',packing:'st-packing',shipping:'st-shipping',delivered:'st-delivered',cancelled:'st-cancelled',refunded:'st-refunded'}[s]||'st-new');
    const str = s => ({new:'Новый',awaiting_payment:'Ожидает оплату',paid:'Оплачен',confirmed:'Подтверждён',packing:'Собирается',shipping:'В доставке',delivered:'Доставлен',cancelled:'Отменён',refunded:'Возврат'}[s]||s);
    $('ovlBody').innerHTML = `<h2 class="ovl-title">${t('myOrders')}</h2>` + (orders.length ? orders.map(o=>`
      <div class="card anim" style="margin-top:12px;padding:15px;cursor:default">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="serif" style="font-weight:900;font-size:17px">#${o.id}</span>
          <span class="st-pill ${stl(o.status)}">${str(o.status)}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);font-weight:700;margin-top:4px">${(o.created_at||'').slice(0,16).replace('T',' ')}</div>
        <div style="font-size:13px;font-weight:600;margin-top:8px">${o.items.map(i=>`• ${i.name_ru} ×${i.qty}`).join('<br>')}</div>
        ${o.tracking?`<div class="tl">🔖 Трек: ${o.tracking}</div>`:''}
        <div class="tl">${(o.history||[]).map(h=>`<div>· ${str(h.status)} — ${(h.at||'').slice(5,16).replace('T',' ')}</div>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-weight:800">${t('total')}</span><span class="price-gold" style="font-size:17px">${o.total_local}</span></div>
        <button class="btn btn-ghost" style="margin-top:10px;font-size:13px" onclick="repeatOrder(${o.id})">${t('repeat')}</button>
      </div>`).join('') : `<div class="empty"><div class="e-title">${t('noOrders')}</div></div>`);
  } catch(e){ toast(t('net')); }
}
function repeatOrder(id){
  api('/my/orders?initData=' + encodeURIComponent(tg.initData)).then(orders=>{
    const o = orders.find(x=>x.id===id); if (!o) return;
    o.items.forEach(i=>{ S.cart[i.id]=(S.cart[i.id]||0)+i.qty; });
    save(); updateCartBadge(); closeOvl(); toast(t('added')); openCart();
  }).catch(()=>toast(t('net')));
}

// ---------- страна ----------
function openCountrySheet(){
  $('csBody').innerHTML = `<h2 class="sh-title">${t('country')}</h2><div style="color:var(--muted);font-weight:600;font-size:13px;margin-top:4px">Валюта, доставка и оплата подстроятся автоматически</div>` +
    (S.settings.countries||[]).map(c=>`<div class="opt ${S.country&&S.country.code===c.code?'on':''}" onclick="pickCountry('${c.code}')">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">${c.flag}</span>
      <div><div style="font-weight:800">${S.lang==='en'?c.name_en:c.name_ru}</div><div style="font-size:11.5px;color:var(--muted)">${{USD:'$',RUB:'₽',KZT:'₸',UZS:'сўм',BYN:'Br',KGS:'с',AMD:'֏',GEL:'₾',AZN:'₼',TJS:'SM',MDL:'L'}[c.currency]} · ${c.days}</div></div></div>
      <span class="radio"></span></div>`).join('');
  openSheet('cs');
}
function pickCountry(code){
  const c = S.settings.countries.find(x=>x.code===code); if (!c) return;
  S.country = c; save(); renderCountry(); closeSheet('cs'); haptic();
  fetchSettings(code); // реквизиты оплат приходят только для своей страны
  if (S.checkout && $('ovlGeneric').classList.contains('open')) renderOvl();
  toast(c.flag + ' ' + (S.lang==='en'?c.name_en:c.name_ru));
  renderSections();
}

// ---------- чат ----------
function openChatView(){
  S.view='chat'; renderNav();
  openOvl('', `<h2 class="ovl-title">${t('chat')}</h2>
    <div class="qr-chips" style="margin-top:10px">
      <button class="qr-chip" onclick="quickChat('Хочу подарочный набор')">🎁 Подарочный набор</button>
      <button class="qr-chip" onclick="quickChat('Узнать статус заказа')">📦 Статус заказа</button>
      <button class="qr-chip" onclick="quickChat('Нужна консультация')">💬 Консультация</button>
    </div>
    <div id="chatBox"><div class="empty" style="padding:30px 10px">${t('chatSub')}</div></div>
    <div class="chat-input">
      <button class="icon-btn" style="width:46px;height:46px;flex:none" onclick="$('photoFile').click()">🖼</button>
      <input id="chatIn" placeholder="…" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">➤</button>
    </div>`);
  loadChat();
  S.chatTimer = setInterval(loadChat, 8000);
}
function quickChat(text){ $('chatIn').value = text; sendChat(); }
async function loadChat(){
  if (DEMO) return;
  try {
    const msgs = await api('/support?initData=' + encodeURIComponent(tg.initData));
    const box = $('chatBox'); if (!box) return;
    box.innerHTML = msgs.map(m=>`<div class="bub ${m.from_admin?'them':'me'}">${escHtml(m.text)}${m.photo_url?`<img src="${m.photo_url}" onclick="window.open('${m.photo_url}')">`:''}<div class="bt">${(m.at||'').slice(11,16)}</div></div>`).join('') || `<div class="empty" style="padding:30px 10px">${t('chatSub')}</div>`;
    box.scrollTop = box.scrollHeight;
  } catch(e){}
}
async function sendChat(){
  const inp = $('chatIn'); const text = inp.value.trim(); if (!text && !S.pendingPhoto) return;
  if (DEMO){ toast('Откройте магазин из Telegram'); return; }
  inp.value='';
  try { await api('/support', { text: text || '📷', photo_url: S.pendingPhoto || '' }); S.pendingPhoto=''; loadChat(); haptic(); } catch(e){ toast(t('net')); }
}
async function onPhotoPicked(ev){
  const f = ev.target.files[0]; if (!f) return;
  try {
    const b64 = await compress(f);
    const r = await api('/upload', { b64: b64.split(',')[1], mime: 'image/jpeg' });
    S.pendingPhoto = r.url;
    toast('Фото готово — нажмите ➤');
  } catch(e){ toast(t('net')); }
  ev.target.value='';
}
function compress(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

}

};
function openLegal(kind){ $('ovlBackT').textContent = t('profile'); $('ovlBody').innerHTML = LEGAL[kind]; $('ovlGeneric').classList.add('open'); }
function cycleLang(){ const order=['ru','en','uz']; S.lang = order[(order.indexOf(S.lang)+1)%3]; localStorage.setItem('sahar_lang',S.lang); save(); applyLang(); openProfile(); renderNav(); renderChips(); renderSections(); }
function cycleTheme(){ S.theme = {auto:'dark',dark:'light',light:'auto'}[S.theme||'auto']; save(); applyTheme(); openProfile(); }

boot();
