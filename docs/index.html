<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SAHAR</title>
<meta property="og:title" content="SAHAR · Премиальные сладости">
<meta property="og:description" content="Конфеты, трюфели, подарочные наборы">
<meta property="og:image" content="https://dostonravshanov1006800-beep.github.io/sahar-shop/assets/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4A2A20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F7F1EA; --cream:#EFE5D6; --card:#FCF9F4; --text:#2C1E15; --muted:#8A7660; --soft:#BFA98E;
  --hair:#E8DCCB; --field:#F4EDE2; --skel:#EDE2D2; --skel2:#F7F0E6;
  --pri:#4A2A20; --pri-fg:#FFF6EE;
  --caramel:#C89F7E; --caramel-deep:#A9784F; --caramel-soft:#F3E7D5;
  --ok:#3E7B5A; --err:#B3483B; --nav-ink:#6E5B47;
  --shadow:0 6px 20px rgba(74,42,32,.08);
  --sheet-shadow:0 -8px 32px rgba(74,42,32,.14);
}
[data-theme="dark"]{
  --bg:#1A120C; --cream:#251A12; --card:#2A1F15; --text:#F3E9DE; --muted:#A08C75; --soft:#7A6753;
  --hair:#3B2C1F; --field:#2E2318; --skel:#2E2418; --skel2:#3B2C1F;
  --pri:#C89F7E; --pri-fg:#2A160C;
  --caramel:#C89F7E; --caramel-deep:#D5B28C; --caramel-soft:#3A2A1B;
  --ok:#5FA37E; --err:#D96A5D; --nav-ink:#C4B49B;
  --shadow:0 6px 20px rgba(0,0,0,.4);
  --sheet-shadow:0 -8px 32px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font-family:inherit}
img{-webkit-user-drag:none}
::-webkit-scrollbar{display:none}
.press{transition:transform .2s ease,opacity .2s;will-change:transform}
.press:active{transform:scale(.97)}
.press-h:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes skel{to{background-position:-200% 0}}
[data-anim="minimal"] *{animation:none!important}
[data-anim="minimal"] .anim{opacity:1;transform:none}
.anim{animation:fadeUp .38s cubic-bezier(.2,.8,.3,1) both}
.fadein{animation:fadeUp .3s ease both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* каркас */
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
#main.vin{animation:vin .34s cubic-bezier(.32,.72,.28,1)}
@keyframes vin{from{opacity:0;transform:translateX(26px) scale(.985)}to{opacity:1;transform:none}}
#main.vout{animation:vout .22s ease}
@keyframes vout{from{opacity:1}to{opacity:0;transform:translateX(-14px)}}
#main{padding:0 16px 20px}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border-bottom:1px solid color-mix(in srgb,var(--hair) 70%,transparent);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{line-height:1;cursor:default;display:flex;align-items:center;gap:9px}
.brand-ava{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bg) 60%,transparent),0 3px 10px rgba(56,36,20,.22)}
.brand .bflower{color:var(--caramel-deep)}
.brand .bt{line-height:1}
.brand .logo{font-size:22px;font-weight:800;letter-spacing:.09em}
.brand .sub{font-size:7.5px;font-weight:700;letter-spacing:.3em;color:var(--soft);text-transform:uppercase;margin-top:3px}
.hbtns{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border:none;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;color:var(--text)}
.icon-btn svg{pointer-events:none}
.badge-n{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--pri);color:var(--pri-fg);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.chip-country{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:19px;background:var(--cream);font-weight:700;font-size:12.5px;cursor:pointer;border:none;color:var(--text)}
/* поиск */
.search{margin-top:10px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:0 14px;height:46px}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font:500 14.5px inherit;font-family:inherit}
.search input::placeholder{color:var(--soft)}
/* баннер */
#banners{margin:14px -14px 0;overflow-x:auto;scroll-snap-type:x mandatory;display:flex;scrollbar-width:none}
.banner{flex:none;width:100%;scroll-snap-align:center;border-radius:24px;overflow:hidden;height:200px;position:relative;background:var(--skel)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .btext{position:absolute;left:0;right:0;bottom:0;padding:64px 16px 14px;background:linear-gradient(transparent,rgba(15,8,4,.74));color:#fff;text-align:left}
.banner .bt{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.banner .bs{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.9);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .btext.pos-left{text-align:left;align-items:flex-start;display:flex;flex-direction:column}
.banner .btext.pos-center{text-align:center;align-items:center;display:flex;flex-direction:column}
.banner .btext.pos-right{text-align:right;align-items:flex-end;display:flex;flex-direction:column}
.banner.tdark .btext{color:#252321}
.banner.tdark .bs{color:rgba(37,35,33,.78)}
.banner .bcta{margin-top:9px;display:inline-flex;align-items:center;padding:8px 15px;border-radius:14px;background:#FFFFFF;color:#4B2B20;font-size:11.5px;font-weight:800;border:none;cursor:pointer}
/* категории: плитки */
#catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:18px}
.catt{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:none;background:transparent;padding:0}
.catt .cic{width:56px;height:56px;border-radius:18px;background:var(--caramel-soft);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;transition:transform .2s cubic-bezier(.34,1.56,.64,1);color:var(--caramel-deep)}
.catt-promo{grid-column:1/-1;border-radius:24px;background:linear-gradient(135deg,var(--caramel) 0%,var(--caramel-soft) 60%,var(--cream) 100%);border:1px solid rgba(74,42,32,.10);display:flex;align-items:center;gap:16px;padding:22px 20px;cursor:pointer;text-align:left;transition:transform .2s ease;box-shadow:0 10px 30px rgba(74,42,32,.12),inset 0 1px 0 rgba(255,255,255,.5)}
.catt-promo:active{transform:scale(.97)}
.catt-promo.on{outline:2px solid var(--pri);outline-offset:2px}
.catt-promo .ppic{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;box-shadow:0 6px 14px rgba(74,42,32,.14)}
.catt-promo .pt{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15;display:block}
.catt-promo .ps{font-size:13px;font-weight:600;color:var(--muted);margin-top:3px;display:block}
.catt-promo .par{margin-left:auto;color:#4B2B20;flex:none}
.catt:active .cic{transform:scale(.88)}
.catt .cnm{font-size:10px;font-weight:600;color:var(--muted);text-align:center;line-height:1.25}
.catt.on .cnm{color:var(--text);font-weight:700}
/* чипы */
#chips{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chip{flex:none;padding:11px 16px;border-radius:16px;background:var(--card);border:1px solid var(--hair);font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;min-height:44px;display:flex;align-items:center}
.chip.on{background:var(--pri);color:var(--pri-fg);font-weight:700;border-color:var(--pri)}
.chip.mini{padding:7px 11px;font-size:11px;border-radius:15px}
.chip.reset{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.chips-row{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.found-n{font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 2px 0}
/* секции и сетка */
.sect{margin-top:24px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between}
.sect-t{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sect-s{font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;position:relative;border:1px solid var(--hair);box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:1/1;background:linear-gradient(100deg,var(--skel) 40%,var(--skel2) 50%,var(--skel) 60%);background-size:200% 100%;animation:skel 1.3s infinite}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.tags{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:4px;z-index:2}
.tag{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:9px;background:rgba(255,255,255,.94);color:var(--pri);backdrop-filter:blur(4px);width:max-content}
.tag.t-acc{background:var(--caramel);color:#4B2B20}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.94);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.heart svg{stroke:var(--muted);fill:none}
.heart.on svg{fill:var(--pri);stroke:var(--pri)}
.qadd{position:absolute;bottom:8px;right:8px;width:40px;height:40px;border-radius:50%;border:none;background:var(--pri);color:var(--pri-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.qadd:active{transform:scale(.86)}
.qadd.out{background:var(--caramel);color:#4B2B20}
.card .info{padding:10px 12px 12px}
.card .nm{font-weight:700;font-size:13px;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.card .wt{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.card .lowstock{font-size:9.5px;color:var(--caramel-deep);font-weight:700;margin-top:1px}
.price-row{display:flex;align-items:baseline;gap:6px;margin-top:7px;flex-wrap:wrap}
.price{font-size:15px;font-weight:800;letter-spacing:-.02em}
.oldp{font-size:11.5px;color:var(--soft);text-decoration:line-through;font-weight:600}
.disc{font-size:10.5px;font-weight:800;color:var(--caramel-deep)}
/* акция-строка */
.promo-row{margin-top:20px}
.promo-card{background:var(--cream);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;border:1px solid var(--hair)}
.promo-ic{width:42px;height:42px;border-radius:13px;background:var(--caramel-soft);display:flex;align-items:center;justify-content:center;color:var(--pri);flex:none}
/* пустые состояния */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .e-title{font-size:16.5px;color:var(--text);font-weight:800;letter-spacing:-.01em}
.empty .e-sub{font-size:12.5px;margin-top:5px}
.empty .e-ill{margin:0 auto 14px;width:104px;height:104px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--caramel-deep)}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(23,18,12,.4);z-index:79;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--bg);border-radius:24px 24px 0 0;max-height:86dvh;overflow-y:auto;transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,.28,1);box-shadow:var(--sheet-shadow);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:9px auto 3px}
.sheet-pad{padding:8px 18px 10px}
.sh-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
/* overlay */
.ovl{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 120px;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1)}
.ovl.chat-mode{display:flex;flex-direction:column;overflow:hidden;top:0;bottom:auto;height:var(--vvh,100dvh);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.chat-mode #msgBody{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.chat-mode .mtabs{flex:none}
.chat-mode #ovlBody{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat-mode .ovl-back,.chat-mode h2,.chat-mode .sh-sub,.chat-mode .qr-chips,.chat-mode .chat-input,.chat-mode .attach-row{flex:none}
#chatBox{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ovl.open{transform:none}
.ovl-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;background:var(--cream);border:none;border-radius:19px;padding:7px 14px 7px 10px}
.ovl-title{font-size:25px;font-weight:800;letter-spacing:-.02em}
/* формы */
.field{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;margin-top:10px}
.field.invalid{border-color:var(--err)}
.ferr{display:none;color:var(--err);font-size:11.5px;font-weight:700;margin-top:4px}
.field.invalid .ferr{display:block}
.field label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.field input,.field textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);font:600 15px inherit;font-family:inherit;resize:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1.5px solid var(--hair);border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer;transition:border-color .18s}
.opt.on{border-color:var(--pri)}
.opt .ot{font-weight:700;font-size:14px}
.opt .od{font-size:12px;color:var(--muted);margin-top:1px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--hair);flex:none;transition:all .18s;position:relative}
.opt.on .radio{border-color:var(--pri)}
.opt.on .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--pri)}
/* кнопки */
.btn{width:100%;border:none;border-radius:16px;min-height:48px;padding:14px;font:800 15px inherit;font-family:inherit;letter-spacing:-.01em;cursor:pointer}
.btn-pri{background:var(--pri);color:var(--pri-fg)}
.btn-sec{background:var(--cream);color:var(--text);border:1px solid var(--hair)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{padding:10px 16px;font-size:13px;width:auto}
.btn-xs{padding:7px 12px;font-size:11.5px;width:auto;border-radius:10px}
/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px) scale(.96);background:var(--pri);color:var(--pri-fg);padding:12px 20px;border-radius:22px;font-weight:700;font-size:13px;z-index:99;opacity:0;transition:.3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:82%;text-align:center;box-shadow:var(--sheet-shadow)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* нижняя навигация */
nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;display:flex;justify-content:center;padding:7px 8px;min-height:64px;box-sizing:border-box;border-radius:32px;background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border:1px solid color-mix(in srgb,var(--hair) 80%,transparent);box-shadow:0 16px 44px rgba(56,36,20,.24),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .25s}
[data-theme="dark"] nav{box-shadow:0 16px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
body.chat-open nav{display:none}
nav.kb{transform:translateY(110%)}
.nav-in{display:flex;width:100%;max-width:430px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap;color:var(--nav-ink);cursor:pointer;border:none;background:transparent;min-height:48px;transition:color .2s,transform .2s ease}
.tab:active{transform:scale(.94)}
.tab.on{color:var(--pri);font-weight:700}
.tab .tic{position:relative;display:flex;padding:6px 15px;border-radius:17px;transition:background .3s,box-shadow .3s}
.tab.on .tic{background:linear-gradient(135deg,color-mix(in srgb,var(--caramel-soft) 85%,transparent),color-mix(in srgb,var(--caramel) 30%,transparent));box-shadow:0 3px 12px rgba(122,77,52,.16),inset 0 1px 0 rgba(255,255,255,.5)}
.tab svg{pointer-events:none;display:block}
.nav-badge{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab svg{pointer-events:none}
/* корзина строки */
.cline{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.cline:last-child{border-bottom:none}
.cline>img{width:56px;height:56px;border-radius:13px;object-fit:cover;flex:none;background:var(--skel)}
.qty{display:flex;align-items:center;border:1.5px solid var(--hair);border-radius:12px;overflow:hidden;flex:none;background:var(--card)}
.qty button{width:38px;height:38px;border:none;background:transparent;color:var(--text);font-size:17px;font-weight:700;cursor:pointer}
.qty button:active{background:var(--field)}
.qty span{width:26px;text-align:center;font-weight:800;font-size:13.5px}
/* чекаут шаги */
.steps{display:flex;gap:5px;margin:6px 0 14px}
.stepdot{flex:1;height:3.5px;border-radius:2px;background:var(--hair);transition:background .3s}
.stepdot.on{background:var(--caramel-deep)}
/* сводка заказа */
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--muted);padding:5px 2px}
.sumrow.tot{font-weight:800;color:var(--text);font-size:16px;border-top:1px solid var(--hair);margin-top:6px;padding-top:12px}
/* сообщения: вкладки */
.mtabs{display:flex;background:var(--field);border-radius:14px;padding:3px;margin-top:12px}
.mtab{flex:1;border:none;background:transparent;border-radius:11px;padding:8px 0;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s}
.mtab.on{background:var(--text);color:var(--bg);box-shadow:0 2px 8px rgba(56,36,20,.18)}
.notif{display:flex;gap:11px;padding:13px 2px;border-bottom:1px solid var(--hair);align-items:flex-start}
.notif:last-child{border-bottom:none}

  const step = S.settings.rounding[cur] || 1;
  v = Math.round(v / step) * step;
  const sym = {USD:'$',RUB:'₽',KZT:'₸',UZS:'сўм',BYN:'Br',KGS:'с',AMD:'֏',GEL:'₾',AZN:'₼',TJS:'SM',MDL:'L'}[cur] || cur;

async function copyText(x){
  x = String(x == null ? '' : x);
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(x); toast('Скопировано ✓'); return; } } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = x; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;opacity:.01;font-size:16px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, x.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok){ toast('Скопировано ✓'); return; }
  } catch (e) {}
  showCopySheet(x);
}
function showCopySheet(x){
  const old = document.getElementById('copyOvBg'); if (old) old.remove();

  document.body.appendChild(bg);
  requestAnimationFrame(()=>{
    try {
      const el = document.getElementById('copyVal');

async function loadChat(){
  if (DEMO) return;
  try {
    const msgs = await api('/support?mark=1&initData=' + encodeURIComponent(tg.initData));
    const box = $('chatBox'); if (!box) return;
    const iso = d => d.toISOString().slice(0,10);
    const today = iso(new Date()), yest = iso(new Date(Date.now() - 864e5));
    let html = '', lastDay = '';
    for (const m of msgs){
      const day = (m.at||'').slice(0,10);
      if (day && day !== lastDay){
        lastDay = day;
        const label = day===today ? 'Сегодня' : (day===yest ? 'Вчера' : day.split('-').reverse().join('.'));
        html += `<div class="day-sep">${label}</div>`;
      }
      const mine = !m.from_admin;
      let ticks = '';
      if (mine){
        const read = msgs.some(x => x.from_admin && (x.at||'') > (m.at||''));
        ticks = `<span class="tick">${read ? '✓✓' : '✓'}</span>`;
      }
      const u = escHtml(m.photo_url || '');
      html += `<div class="msg-row ${mine?'me':'them'}">${mine?'':`<img class="bava" src="assets/bot-avatar.jpg" alt="">`}<div class="bub ${mine?'me':'them'}${u&&!m.text?' photo':''}">${u?`<img class="bphoto" src="${u}" onclick="viewPhoto('${u}')">`:''}${m.text?escHtml(m.text):''}<div class="bt"><span>${(m.at||'').slice(11,16)}</span>${ticks}</div></div></div>`;
    }
    box.innerHTML = html || `<div class="empty" style="padding:26px 8px">${t('chatSub')}</div>`;
    box.scrollTop = box.scrollHeight;
    clearUnread();
  } catch(e){}
}

  const row = $('attachRow'); if (!row) return;
  row.classList.remove('hidden');
  row.innerHTML = `<img src="${URL.createObjectURL(f)}"><div class="attach-st" id="attachSt"><span class="spinner"></span>Загрузка…</div>`;
  uploadPhoto();
}
async function uploadPhoto(){
  const st = $('attachSt'); if (!st || !photoFile) return;
  st.innerHTML = `<span class="spinner"></span>Загрузка…`;
  try {
    const b64 = await compress(photoFile);
    const r = await api('/upload', { b64: b64.split(',')[1], mime: 'image/jpeg' });
    S.pendingPhoto = r.url;
    st.innerHTML = `<span style="color:var(--ok)">Фото готово</span><button class="btn btn-sec btn-xs press-h" style="margin-left:8px" onclick="clearAttach()">Убрать</button>`;
    updateSendBtn();
  } catch(e){
    st.innerHTML = `<span style="color:var(--err)">Ошибка загрузки</span><button class="btn btn-sec btn-xs press-h" style="margin-left:8px" onclick="uploadPhoto()">Повторить</button>`;
  }
}
function clearAttach(){ S.pendingPhoto = ''; photoFile = null; const row = $('attachRow'); if (row){ row.classList.add('hidden'); row.innerHTML = ''; } updateSendBtn(); }
function compress(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

    </div>`).join('')}
    <div class="field"><label>Город</label><input id="naCity"></div>
    <div class="field"><label>Адрес</label><input id="naAddr"></div>
    <button class="btn btn-sec press" style="margin-top:12px" onclick="addAddr()">+ Добавить адрес</button>`;

function addAddr(){
  const city = ($('naCity')||{}).value?.trim(); const addr = ($('naAddr')||{}).value?.trim();
  if (!city || !addr){ toast('Заполните город и адрес'); return; }
  S.addrs.push({city, addr}); S.selAddr = S.addrs.length-1; save(); renderAddrList(); toast('Адрес добавлен');
}
function selAddrI(i){ haptic(); S.selAddr = i; save(); renderAddrList(); }
function delAddr(i){ if (S.selAddr === i) S.selAddr = -1; else if (S.selAddr > i) S.selAddr--; S.addrs.splice(i,1); save(); renderAddrList(); }
