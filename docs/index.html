<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SAHAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F2F2; --card:#FFFFFF; --text:#111111; --muted:#8A8A8E; --soft:#B0B0B5;
  --hair:#E9E9EA; --field:#E9E9EB; --skel:#E4E4E6; --skel2:#EFEFF0;
  --acc1:#C98A52; --acc2:#A5672F; --acc-soft:#F6ECE1;
  --ok:#34784B; --err:#B3413B;
  --shadow:0 8px 28px rgba(0,0,0,.07);
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.14);
}
[data-theme="dark"]{
  --bg:#0D0D0F; --card:#1A1A1E; --text:#F5F5F7; --muted:#9A9AA1; --soft:#77777E;
  --hair:#2A2A2F; --field:#26262B; --skel:#232327; --skel2:#2B2B30;
  --acc1:#D89A5F; --acc2:#B5763B; --acc-soft:#2E2318;
  --ok:#4E9A6B; --err:#D96A5D;
  --shadow:0 8px 28px rgba(0,0,0,.4);
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
button{font-family:inherit}
img{-webkit-user-drag:none}
::-webkit-scrollbar{display:none}
/* ---- spring / liquid ---- */
.press{transition:transform .22s cubic-bezier(.34,1.56,.64,1),opacity .2s;will-change:transform}
.press:active{transform:scale(.95)}
.press-h:active{transform:scale(.98)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes skel{to{background-position:-200% 0}}
[data-anim="minimal"] *{animation:none!important}
[data-anim="minimal"] .anim{opacity:1;transform:none}
.anim{animation:fadeUp .38s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- каркас ---- */
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding-bottom:96px}
#main{padding:0 14px 20px}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{line-height:1;cursor:default}
.brand .logo{font-size:23px;font-weight:900;letter-spacing:.06em}
.brand .sub{font-size:8px;font-weight:700;letter-spacing:.34em;color:var(--soft);text-transform:uppercase;margin-top:3px}
.hbtns{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border:none;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.icon-btn svg{pointer-events:none}
.badge-n{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(165,103,47,.4)}
.chip-country{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;background:var(--card);font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow);border:none;color:var(--text)}
/* поиск */
.search{margin-top:10px;display:flex;align-items:center;gap:9px;background:var(--field);border-radius:13px;padding:0 13px;height:42px}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;border:none;outline:none;background:transparent;color:var(--text);font:500 14.5px inherit;font-family:inherit}
.search input::placeholder{color:var(--soft)}
/* баннеры */
#banners{margin:14px -14px 0;overflow-x:auto;scroll-snap-type:x mandatory;display:flex;scrollbar-width:none}
.banner{flex:none;width:100%;scroll-snap-align:center;border-radius:20px;overflow:hidden;height:146px;position:relative;background:var(--skel)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .btext{position:absolute;left:0;right:0;bottom:0;padding:38px 18px 15px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.banner .bt{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.banner .bs{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:4px}
.banner .bdots{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:4px;justify-content:center}
.banner .bdots i{width:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.banner .bdots i.on{background:#fff;width:14px}
/* чипы */
#chips{display:flex;gap:8px;overflow-x:auto;margin:16px -14px 0;padding:2px 14px 4px;scrollbar-width:none}
.chip{flex:none;padding:9px 15px;border-radius:20px;background:var(--field);border:none;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--text);color:var(--bg);font-weight:700}
.chip.mini{padding:7px 12px;font-size:11.5px;border-radius:16px}
/* секции и сетка */
.sect{margin-top:24px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between}
.sect-t{font-size:21px;font-weight:800;letter-spacing:-.02em}
.sect-s{font-size:9.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.card .ph{position:relative;aspect-ratio:1/1;background:linear-gradient(100deg,var(--skel) 40%,var(--skel2) 50%,var(--skel) 60%);background-size:200% 100%;animation:skel 1.3s infinite}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.tags{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:4px;z-index:2}
.tag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:9px;background:rgba(255,255,255,.95);color:var(--text);backdrop-filter:blur(4px);width:max-content}
.tag.t-acc{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff}
.heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.heart svg{stroke:var(--soft);fill:none}
.heart.on svg{fill:var(--acc2);stroke:var(--acc2)}
.qadd{position:absolute;bottom:9px;right:9px;width:33px;height:33px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 4px 12px rgba(165,103,47,.45)}
.qadd:active{transform:scale(.86)}
.card .info{padding:11px 13px 13px}
.card .nm{font-weight:700;font-size:13px;line-height:1.3;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.01em}
.card .wt{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.price-row{display:flex;align-items:baseline;gap:6px;margin-top:7px;flex-wrap:wrap}
.price{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.oldp{font-size:11.5px;color:var(--soft);text-decoration:line-through;font-weight:600}
.disc{font-size:10.5px;font-weight:800;color:var(--acc2)}
/* строки-акции */
.promo-row{margin-top:20px}
.promo-card{background:var(--card);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.promo-ic{width:42px;height:42px;border-radius:13px;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;color:var(--acc2);flex:none}
/* пустые состояния */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .e-title{font-size:16px;color:var(--text);font-weight:700;letter-spacing:-.01em}
.empty .e-sub{font-size:12.5px;margin-top:4px}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:22px 22px 0 0;max-height:90dvh;overflow-y:auto;transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,.28,1);box-shadow:var(--sheet-shadow);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:9px auto 3px}
.sheet-pad{padding:8px 18px 10px}
.sh-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px}
/* overlay */
.ovl{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 120px;transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,.28,1)}
.ovl.open{transform:none}
.ovl-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;background:var(--card);border:none;border-radius:20px;padding:7px 14px 7px 10px;box-shadow:var(--shadow)}
.ovl-title{font-size:25px;font-weight:800;letter-spacing:-.02em}
/* формы */
.field{background:var(--card);border-radius:14px;padding:11px 14px;margin-top:10px;box-shadow:var(--shadow)}
.field label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:5px}
.field input,.field textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);font:600 15px inherit;font-family:inherit;resize:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:13px 15px;margin-top:10px;cursor:pointer;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .18s}
.opt.on{border-color:var(--acc1)}
.opt .ot{font-weight:700;font-size:14px}
.opt .od{font-size:12px;color:var(--muted);margin-top:1px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--hair);flex:none;transition:all .18s;position:relative}
.opt.on .radio{border-color:var(--acc2)}
.opt.on .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2))}
/* кнопки */
.btn{width:100%;border:none;border-radius:14px;padding:15px;font:800 15px inherit;font-family:inherit;letter-spacing:-.01em;cursor:pointer}
.btn-pri{background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;box-shadow:0 6px 18px rgba(165,103,47,.35)}
.btn-dark{background:var(--text);color:var(--bg)}
.btn-sec{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{padding:10px 16px;font-size:13px;width:auto}
.btn-xs{padding:7px 12px;font-size:11.5px;width:auto;border-radius:10px}
/* toast */
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,16px) scale(.96);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:22px;font-weight:700;font-size:13px;z-index:99;opacity:0;transition:.3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;max-width:82%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
/* нижняя навигация */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--hair);display:flex;justify-content:center;padding:7px 0 calc(env(safe-area-inset-bottom,0px) + 7px);transition:transform .25s}
nav.kb{transform:translateY(110%)}
.nav-in{display:flex;width:100%;max-width:430px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 2px;font-size:10px;font-weight:600;color:var(--soft);cursor:pointer;border:none;background:transparent;letter-spacing:0;transition:color .2s,transform .22s cubic-bezier(.34,1.56,.64,1)}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--text)}
.tab svg{pointer-events:none}
/* корзина: строки */
.cline{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.cline:last-child{border-bottom:none}
.cline>img{width:56px;height:56px;border-radius:13px;object-fit:cover;flex:none;background:var(--skel)}
.qty{display:flex;align-items:center;border:1.5px solid var(--hair);border-radius:12px;overflow:hidden;flex:none;background:var(--card)}
.qty button{width:33px;height:33px;border:none;background:transparent;color:var(--text);font-size:17px;font-weight:700;cursor:pointer}
.qty button:active{background:var(--field)}
.qty span{width:26px;text-align:center;font-weight:800;font-size:13.5px}
/* чекаут: шаги */
.steps{display:flex;gap:5px;margin:6px 0 14px}
.stepdot{flex:1;height:3.5px;border-radius:2px;background:var(--hair);transition:background .3s}
.stepdot.on{background:linear-gradient(90deg,var(--acc1),var(--acc2))}
/* чат */
#chatBox{display:flex;flex-direction:column;gap:7px;padding:8px 0 14px}
.bub{max-width:80%;padding:10px 14px;border-radius:19px;font-size:14.5px;font-weight:500;animation:fadeUp .25s ease;letter-spacing:-.01em}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);color:var(--text);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bub .bt{font-size:9.5px;opacity:.65;margin-top:3px;font-weight:700}
.bub img{max-width:180px;border-radius:12px;margin-top:6px;display:block}
.qr-chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.qr-chip{flex:none;padding:9px 14px;background:var(--card);border:1.5px solid var(--hair);color:var(--text);border-radius:19px;font-size:12.5px;font-weight:700;cursor:pointer}
.qr-chip:active{border-color:var(--acc1)}
.chat-input{display:flex;gap:8px;padding:10px 0 4px;position:sticky;bottom:0;background:var(--bg)}
.chat-input input{flex:1;background:var(--card);border:none;border-radius:20px;padding:0 16px;height:44px;color:var(--text);font:500 14.5px inherit;font-family:inherit;outline:none;box-shadow:var(--shadow)}
.chat-input .cbtn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.chat-input .cbtn.ghost{background:var(--card);box-shadow:var(--shadow);color:var(--text)}
/* профиль */
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#fff;flex:none}
.plist{background:var(--card);border-radius:16px;margin-top:14px;overflow:hidden;box-shadow:var(--shadow)}
.prow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--hair);background:transparent}
.prow:last-child{border-bottom:none}
.prow:active{background:var(--field)}
.prow .pl{font-weight:600;font-size:14px;display:flex;align-items:center;gap:11px}
.prow .pv{color:var(--muted);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
/* успех */
.success-wrap{text-align:center;padding:54px 24px 20px}
.check-acc{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--acc1),var(--acc2));display:flex;align-items:center;justify-content:center;margin:0 auto;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;color:#fff;box-shadow:0 14px 34px rgba(165,103,47,.4)}
.onum{font-size:33px;font-weight:900;letter-spacing:-.02em;margin-top:18px}
/* прогресс/заметки */
.dprog{background:var(--card);border-radius:13px;padding:12px 14px;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.dbar{height:5px;border-radius:3px;background:var(--field);margin-top:9px;overflow:hidden}
.dbar>div{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));border-radius:3px;transition:width .4s}
/* статусы */
.st-pill{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:11px;letter-spacing:.01em}
.st-new{background:var(--field);color:var(--muted)} .st-paid,.st-confirmed{background:#E4F0E8;color:var(--ok)}
.st-packing,.st-shipping,.st-awaiting_payment{background:var(--acc-soft);color:var(--acc2)} .st-delivered{background:#E4F0E8;color:var(--ok)}
.st-cancelled,.st-refunded{background:#F6E3E1;color:var(--err)}
[data-theme="dark"] .st-paid,[data-theme="dark"] .st-confirmed,[data-theme="dark"] .st-delivered{background:#1B2E22}
[data-theme="dark"] .st-cancelled,[data-theme="dark"] .st-refunded{background:#33201E}
.tl{margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:500}
.tl div{padding:2px 0}
</style>
</head>
<body data-anim="silk">
<div id="app">
  <header>
    <div class="hrow">
      <div class="brand"><div class="logo">SAHAR</div><div class="sub">Премиальные сладости</div></div>
      <div class="hbtns">
        <button class="chip-country press" onclick="openCountrySheet()"><span id="cFlag">🇷🇺</span><span id="cCode">RU</span></button>
        <button class="icon-btn press" onclick="openCart()" aria-label="cart">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="badge-n hidden" id="cartN">0</span>
        </button>
      </div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Найти трюфели, наборы, шоколад…" oninput="onSearch()">
    </div>
  </header>
  <div id="main">
    <div id="banners"><div class="banner"><div style="width:100%;height:100%;background:linear-gradient(100deg,var(--skel) 40%,var(--skel2) 50%,var(--skel) 60%);background-size:200% 100%;animation:skel 1.3s infinite"></div></div></div>
    <div id="chips"></div>
    <div id="sections"></div>
  </div>
</div>

<!-- product sheet -->
<div class="sheet-bg hidden" id="psBg" onclick="closeSheet('ps')"></div>
<div class="sheet" id="ps"><div class="grab"></div><div class="sheet-pad" id="psBody"></div></div>
<!-- cart sheet -->
<div class="sheet-bg hidden" id="cartBg" onclick="closeSheet('cart')"></div>
<div class="sheet" id="cart"><div class="grab"></div><div class="sheet-pad" id="cartBody"></div></div>
<!-- country sheet -->
<div class="sheet-bg hidden" id="csBg" onclick="closeSheet('cs')"></div>
<div class="sheet" id="cs"><div class="grab"></div><div class="sheet-pad" id="csBody"></div></div>

<!-- overlay экраны -->
<div class="ovl" id="ovlGeneric"><button class="ovl-back press-h" onclick="closeOvl()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="ovlBackT">Назад</span></button><div id="ovlBody"></div></div>

<nav><div class="nav-in" id="navIn"></div></nav>
<div id="toast"></div>
<input type="file" id="photoFile" accept="image/*" class="hidden" onchange="onPhotoPicked(event)">

<script>

function money(usd){
  const cur = S.country ? S.country.currency : 'USD';
  const r = S.settings.rates[cur] || 1;
  let v = usd * r * (1 + ((S.settings.markup||{})[S.country ? S.country.code : ''] || 0) / 100);
  const step = S.settings.rounding[cur] || 1;
  v = Math.round(v / step) * step;

        <div class="price" style="font-size:13.5px;margin-top:2px">${money(p.price_usd)}</div></div>
        <div class="qty"><button onclick="bQty(${p.id},-1)">−</button><span id="bq${p.id}">${S.build[p.id]||0}</span><button onclick="bQty(${p.id},1)">+</button></div>

function bQty(pid, n){
  S.build[pid] = Math.max(0, (S.build[pid]||0) + n);
  $('bq'+pid).textContent = S.build[pid];
  $('bTotal').textContent = money(buildSum());
  haptic();
}
function buildSum(){
  let s2 = (S.giftPack?3:0);
  for (const [pid, q] of Object.entries(S.build)) { const p = S.prods.find(x=>x.id==pid); if (p) s2 += p.price_usd * q; }
  return s2;
}
function buildToCart(){
  const items = Object.entries(S.build).filter(([,q])=>q>0);
  if (!items.length){ toast('Отметьте хотя бы одну сладость'); return; }
  items.forEach(([pid,q])=>{ S.cart[pid]=(S.cart[pid]||0)+q; });
  const card = $('bCard') ? $('bCard').value.trim() : '';
  S.giftCardText = card;
  S.giftPack = true;
  save(); updateCartBadge(); closeSheet('ps'); toast('Набор в корзине'); openCart();
}

}

    <div style="margin-top:20px">
      <details style="border-bottom:1px solid var(--hair);padding:12px 2px"><summary style="font-weight:700;font-size:14px;cursor:pointer;list-style:none">Состав и аллергены</summary><div style="font-size:13px;margin-top:8px;font-weight:500;color:var(--muted)">${escHtml(pdesc(p))}</div></details>

function psQty(n){ psQ = Math.max(1, psQ + n); $('psQty').textContent = psQ; haptic(); }
function openSheet(id){ $(id+'Bg').classList.remove('hidden'); requestAnimationFrame(()=>$(id).classList.add('open')); }
function closeSheet(id){ $(id).classList.remove('open'); setTimeout(()=>$((id)+'Bg').classList.add('hidden'), 300); }

// ---------- корзина ----------
function addToCart(pid, qty){
  if (!S.settings.shop_open && S.settings.shop_open!==undefined) { toast('Магазин временно закрыт'); return; }
  haptic(); S.cart[pid] = (S.cart[pid]||0) + qty; save(); updateCartBadge(); toast(t('added'));
  closeSheet('ps'); openCart();
}
function setQty(pid, n){ if (n<=0) delete S.cart[pid]; else S.cart[pid]=n; save(); updateCartBadge(); renderCart(); }
function cartItems(){ return Object.entries(S.cart).map(([id,qty])=>({ p:S.prods.find(x=>x.id==id), qty })).filter(x=>x.p); }
function cartTotal(){ return cartItems().reduce((s,x)=>s+x.p.price_usd*x.qty,0); }
function updateCartBadge(){ const n = Object.values(S.cart).reduce((a,b)=>a+b,0); const el=$('cartN'); el.textContent=n; el.classList.toggle('hidden', n===0); }
function toggleFav(pid){ haptic(); const i=S.fav.indexOf(pid); if (i>=0) S.fav.splice(i,1); else S.fav.push(pid); save(); renderSections(); if($('ps').classList.contains('open')) openProduct(pid); }
function openCart(){
  if (!Object.keys(S.cart).length){ toast(t('cartEmpty')); return; }
  renderCart(); openSheet('cart');
}
async function applyPromo(){
  const code = $('promoIn').value.trim().toUpperCase(); S.promo = code; save();
  if (!code){ S.promoPct=0; renderCart(); return; }
  try {
    const r = await fetch(API + '/api/promo?code=' + encodeURIComponent(code)); const j = await r.json();
    if (j.ok){ S.promoPct = j.percent||0; toast('−' + j.percent + '% применён'); }
    else { S.promoPct = 0; toast('Промокод не найден'); }
  } catch(e){ toast(t('net')); }
  renderCart();
}
function cartDiscount(){ return Math.round(cartTotal() * (S.promoPct||0)) / 100; }
function renderCart(){
  const items = cartItems(); const sub = cartTotal();
  const c = S.country || {}; const free = c.free_from_usd || Infinity;
  $('cartBody').innerHTML = `
    <h2 class="sh-title">${t('cart')}</h2>
    ${items.map(x=>`<div class="cline">
      <img src="${x.p.image_url||PH}"><div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13.5px">${pname(x.p)}</div>
        <div class="price" style="font-size:14px;margin-top:2px">${money(x.p.price_usd)}</div>
      </div>
      <div class="qty"><button onclick="setQty(${x.p.id},${x.qty-1})">−</button><span>${x.qty}</span><button onclick="setQty(${x.p.id},${x.qty+1})">+</button></div>
    </div>`).join('')}
    <div class="dprog">${sub<free? t('freeFrom2').replace('{n}', usd(free-sub)) : t('free') + ' ✓'}
      <div class="dbar"><div style="width:${Math.min(100, sub/free*100)}%"></div></div></div>
    <div class="field"><label>${t('promo')}</label><div style="display:flex;gap:8px"><input id="promoIn" style="flex:1;text-transform:uppercase" value="${S.promo||''}"><button class="btn btn-sec btn-sm press-h" onclick="applyPromo()">${t('apply')}</button></div><div id="promoMsg" style="font-size:11.5px;font-weight:700;color:var(--acc2);margin-top:5px">${S.promoPct?('−'+S.promoPct+'% применён'):''}</div></div>
    <div class="field"><label>${t('giftCard')}</label><textarea id="giftCard" rows="2" placeholder="…"></textarea></div>
    <label class="opt ${S.giftPack?'on':''}" onclick="S.giftPack=this.classList.toggle('on')"><span class="ot">${t('giftPack')}</span><span class="radio"></span></label>
    <label class="opt ${S.anon?'on':''}" onclick="S.anon=this.classList.toggle('on')"><span class="ot">${t('anon')}</span><span class="radio"></span></label>
    ${S.promoPct?`<div style="display:flex;justify-content:space-between;margin-top:14px;color:var(--acc2);font-weight:800;font-size:13px;padding:0 2px"><span>${t('promo')} (−${S.promoPct}%)</span><span>−${money(cartDiscount())}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:16px;padding:0 2px"><span>${t('total')}</span><span class="price" style="font-size:19px">${money(sub + (S.giftPack?3:0) - cartDiscount())}</span></div>
    <button class="btn btn-pri press" style="margin-top:14px" onclick="startCheckout()">${t('checkout')}</button>`;
}

// ---------- чекаут 3 шага ----------
function startCheckout(){
  closeSheet('cart');
  S.checkout = { step:1, name:(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'', phone:'', comment:'', city:'', address:'', delivery:'courier', payment:'cash', agree:false, idem:crypto.randomUUID() };
  openOvl(t('checkout'), renderCheckoutStep());
}
function renderCheckoutStep(){
  const c = S.country || {}; const ck = S.checkout;
  const steps = `<div class="steps">${[1,2,3].map(i=>`<div class="stepdot ${ck.step>=i?'on':''}"></div>`).join('')}</div>`;
  let html = steps;
  if (ck.step===1){
    html += `<h3 class="ovl-title" style="font-size:21px">${t('step1')}</h3>
      <div class="field"><label>${t('name')}</label><input id="ckName" value="${escHtml(ck.name)}"></div>
      <div class="field"><label>${t('phone')}</label><input id="ckPhone" value="${escHtml(ck.phone)}" inputmode="tel" placeholder="+7 900 000-00-00"></div>
      ${tg&&tg.requestContact?`<button class="btn btn-sec press" style="margin-top:10px" onclick="sharePhone()">${t('sharePhone')}</button>`:''}
      <div class="field"><label>${t('comment')}</label><textarea id="ckComment" rows="2">${escHtml(ck.comment)}</textarea></div>
      <button class="btn btn-pri press" style="margin-top:16px" onclick="ckStep(2)">Далее</button>`;
  } else if (ck.step===2){
    const courier = c.courier_usd||0, postal = c.postal_usd||0, free = c.free_from_usd||Infinity;
    const sub = cartTotal() + (S.giftPack?3:0);
    html += `<h3 class="ovl-title" style="font-size:21px">${t('step2')}</h3>
      <div class="field" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="closeOvl();openCountrySheet()"><label style="margin:0">${t('country')}</label><div style="font-weight:700">${c.flag||''} ${c.name_ru||''} · <span style="color:var(--acc2)">изменить</span></div></div>
      <div class="field"><label>${t('city')}</label><input id="ckCity" value="${escHtml(ck.city)}"></div>
      <div class="field"><label>${t('address')}</label><input id="ckAddr" value="${escHtml(ck.address)}"></div>
      <div class="opt press-h ${ck.delivery==='courier'?'on':''}" onclick="ck.delivery='courier';renderOvl()"><div><div class="ot">${t('courier')}</div><div class="od">${c.days||''}</div></div><div class="price" style="font-weight:800">${sub>=free?t('free'):money(courier)}</div><span class="radio"></span></div>
      <div class="opt press-h ${ck.delivery==='postal'?'on':''}" onclick="ck.delivery='postal';renderOvl()"><div><div class="ot">${t('postal')}</div><div class="od">${t('delivery')} · трек-номер</div></div><div class="price" style="font-weight:800">${sub>=free?t('free'):money(postal)}</div><span class="radio"></span></div>
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-sec press" style="flex:0 0 96px" onclick="ckStep(1)">Назад</button><button class="btn btn-pri press" style="flex:1" onclick="ckStep(3)">Далее</button></div>`;
  } else {
    const pays = (S.settings.payments||[]).filter(p=>p.active!==false && (S.country?p.countries.includes(S.country.code):true));
    const pm = pays.find(p=>p.id===ck.payment) || pays[0];
    if (pm) ck.payment = pm.id;
    html += `<h3 class="ovl-title" style="font-size:21px">${t('step3')}</h3>
      ${pays.map(p=>`<div class="opt press-h ${ck.payment===p.id?'on':''}" onclick="S.checkout.payment='${p.id}';renderOvl()"><span class="ot">${p.title_ru}</span><span class="radio"></span></div>`).join('')}
      ${pm&&pm.instr_ru?`<div class="dprog" style="display:flex;align-items:center;gap:8px">${pm.instr_ru}<button class="btn btn-sec btn-xs press-h" style="flex:none;margin-left:auto" onclick="copyText(${JSON.stringify(pm.instr_ru)})">Скопировать</button></div>`:''}
      <label class="opt press-h ${ck.agree?'on':''}" onclick="event.preventDefault();S.checkout.agree=this.classList.toggle('on');renderOvl()"><span style="font-size:13px;font-weight:600">${t('agree')} <span style="color:var(--acc2);text-decoration:underline" onclick="event.stopPropagation();openLegal('offer')">оферта</span></span><span class="radio"></span></label>
      <div style="display:flex;justify-content:space-between;font-weight:800;margin-top:18px;padding-top:14px;border-top:1px solid var(--hair)"><span>${t('total')}</span><span class="price" style="font-size:19px">${money(checkoutTotal())}</span></div>`;
    if (tg && tg.MainButton){ tg.MainButton.setText(t('confirm')); updateMainBtn(); }
  }
  return html;
}
function checkoutTotal(){
  const c=S.country||{}; const sub=cartTotal()+(S.giftPack?3:0)-cartDiscount();
  const ship = sub >= (c.free_from_usd||Infinity) ? 0 : (S.checkout.delivery==='postal'?c.postal_usd:c.courier_usd)||0;
  return sub + ship;
}
function updateMainBtn(){ if (tg && tg.MainButton){ if (S.checkout && S.checkout.step===3 && S.checkout.agree) { tg.MainButton.show(); } else tg.MainButton.hide(); } }
function sharePhone(){
  if (!tg || !tg.requestContact) return;
  tg.requestContact((sent) => {
    if (sent){ toast('Номер отправлен владельцу — укажите его и в поле для надёжности'); }
    else toast('Не удалось получить номер — введите вручную');
  });
}
function ckStep(n){
  const ck=S.checkout;
  const grab=(id,k)=>{ if($(id)) ck[k]=$(id).value; };
  grab('ckName','name'); grab('ckPhone','phone'); grab('ckComment','comment'); grab('ckCity','city'); grab('ckAddr','address');
  if (n>=2 && (!ck.name.trim() || !ck.phone.trim())) { toast(t('name')+' / '+t('phone')); return; }
  if (n>=3 && (!ck.city.trim() || !ck.address.trim())) { toast(t('city')+' / '+t('address')); return; }
  ck.step=n; renderOvl(); window.scrollTo(0,0);
}
function mainConfirm(){ if (S.checkout && S.checkout.step===3 && S.checkout.agree) submitOrder(); }

async function submitOrder(){
  if (DEMO) { toast('Откройте магазин из Telegram'); return; }
  const ck = S.checkout;
  if (!ck.agree) { toast(t('agree')); return; }
  if (tg && tg.MainButton) { tg.MainButton.showProgress(true); }
  try {
    const items = cartItems().map(x=>({ id:x.p.id, qty:x.qty }));
    const cardNote = S.giftCardText ? ('🎁 Открытка: "' + S.giftCardText + '"') : '';
    const r = await api('/order', { items, name:ck.name, phone:ck.phone, comment: [ck.comment, cardNote].filter(Boolean).join('\n'), country:S.country.code, city:ck.city, address:ck.address, delivery:ck.delivery, payment_method:ck.payment, promo:S.promo||'', gift:{ premium_pack: !!S.giftPack, card: ($('giftCard')?$('giftCard').value:''), anonymous: !!S.anon }, idem_key: ck.idem });
    if (tg && tg.MainButton) { tg.MainButton.hideProgress(); tg.MainButton.hide(); }
    if (r.ok){
      S.cart = {}; S.promo=''; S.promoPct=0; S.giftPack=false; S.anon=false; S.giftCardText=''; save(); updateCartBadge();

      $('ovlBody').innerHTML = `<div class="success-wrap">
        <div class="check-acc"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="onum">№${r.order_id}</div>
        <div style="font-size:19px;font-weight:800;margin-top:6px;letter-spacing:-.01em">${t('successT')}</div>
        <p style="color:var(--muted);font-weight:500;margin-top:6px">${t('successS')}</p>
        ${S.checkout && S.checkout.payment!=='cash' ? `<div class="dprog" style="text-align:left">Оплата переводом — пришлите, пожалуйста, фото чека в чат, мы подтвердим и соберём заказ.</div>`:''}
        <button class="btn btn-pri press" style="margin-top:22px" onclick="openOrders()">${t('myOrders')}</button>
        <button class="btn btn-sec press" style="margin-top:10px" onclick="closeOvl();S.view='chat';renderNav();openChatView()">${t('writeOwner')}</button>
        <button class="btn btn-sec press" style="margin-top:10px" onclick="closeOvl(true);S.view='shop';renderNav();renderSections()">${t('shop')} →</button>
      </div>`;
      $('ovlBackT').textContent = t('shop');
      window.scrollTo(0,0);
    } else { toast(r.error==='shop_closed'?'Магазин временно закрыт':t('net')); }
  } catch(e){ if (tg && tg.MainButton) tg.MainButton.hideProgress(); toast(e && e.message==='bad_country'?t('country'):t('net')); }
}

// ---------- overlay-экран ----------
function openOvl(title, html){ $('ovlBackT').textContent = t('shop'); $('ovlBody').innerHTML = `<h2 class="ovl-title" style="display:none">${title}</h2>` + html; $('ovlGeneric').classList.add('open'); }

        ${o.tracking?`<div class="tl">Трек: ${o.tracking}</div>`:''}
        <div class="tl">${(o.history||[]).map(h=>`<div>· ${str(h.status)} — ${(h.at||'').slice(5,16).replace('T',' ')}</div>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-weight:800">${t('total')}</span><span class="price" style="font-size:17px">${o.total_local}</span></div>
        <button class="btn btn-sec btn-sm press-h" style="margin-top:10px" onclick="repeatOrder(${o.id})">${t('repeat')}</button>
      </div>`).join('') : `<div class="empty"><div class="e-title">${t('noOrders')}</div></div>`);
  } catch(e){ toast(t('net')); }
}
function repeatOrder(id){
  api('/my/orders?initData=' + encodeURIComponent(tg.initData)).then(orders=>{
    const o = orders.find(x=>x.id===id); if (!o) return;
    o.items.forEach(i=>{ S.cart[i.id]=(S.cart[i.id]||0)+i.qty; });
    save(); updateCartBadge(); closeOvl(); toast(t('added')); openCart();
  }).catch(()=>toast(t('net')));
}

// ---------- страна ----------
function openCountrySheet(){
  $('csBody').innerHTML = `<h2 class="sh-title">${t('country')}</h2><div class="sh-sub">Валюта, доставка и оплата подстроятся автоматически</div>` +
    (S.settings.countries||[]).map(c=>`<div class="opt press-h ${S.country&&S.country.code===c.code?'on':''}" onclick="pickCountry('${c.code}')">
      <div style="display:flex;align-items:center;gap:11px"><span style="font-size:21px">${c.flag}</span>
      <div><div class="ot">${S.lang==='en'?c.name_en:c.name_ru}</div><div class="od">${{USD:'$',RUB:'₽',KZT:'₸',UZS:'сўм',BYN:'Br',KGS:'с',AMD:'֏',GEL:'₾',AZN:'₼',TJS:'SM',MDL:'L'}[c.currency]} · ${c.days}</div></div></div>
      <span class="radio"></span></div>`).join('');
  openSheet('cs');
}
function pickCountry(code){
  const c = S.settings.countries.find(x=>x.code===code); if (!c) return;
  S.country = c; save(); renderCountry(); closeSheet('cs'); haptic();
  fetchSettings(code);
  if (S.checkout && $('ovlGeneric').classList.contains('open')) renderOvl();
  toast(c.flag + ' ' + (S.lang==='en'?c.name_en:c.name_ru));
  renderSections();
}

// ---------- чат ----------
function openChatView(){
  S.view='chat'; renderNav();
  openOvl('', `<h2 class="ovl-title">${t('chat')}</h2>
    <div class="sh-sub" style="margin-top:2px">${t('chatSub')}</div>
    <div class="qr-chips" style="margin-top:12px">
      <button class="qr-chip press-h" onclick="quickChat('Хочу подарочный набор')">Подарочный набор</button>
      <button class="qr-chip press-h" onclick="quickChat('Узнать статус заказа')">Статус заказа</button>
      <button class="qr-chip press-h" onclick="quickChat('Нужна консультация')">Консультация</button>
    </div>
    <div id="chatBox"><div class="empty" style="padding:30px 10px">${t('chatSub')}</div></div>
    <div class="chat-input">
      <button class="cbtn ghost press-h" onclick="$('photoFile').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L8 19"/></svg></button>
      <input id="chatIn" placeholder="…" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="cbtn press-h" onclick="sendChat()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-3.5 16-5-6.5z"/></svg></button>
    </div>`);
  if (S.chatTimer) clearInterval(S.chatTimer);
  loadChat();
  S.chatTimer = setInterval(loadChat, 8000);
}
function quickChat(text){ $('chatIn').value = text; sendChat(); }
async function loadChat(){
  if (DEMO) return;
  try {
    const msgs = await api('/support?initData=' + encodeURIComponent(tg.initData));
    const box = $('chatBox'); if (!box) return;
    box.innerHTML = msgs.map(m=>`<div class="bub ${m.from_admin?'them':'me'}">${escHtml(m.text)}${m.photo_url?`<img src="${m.photo_url}" onclick="window.open('${m.photo_url}')">`:''}<div class="bt">${(m.at||'').slice(11,16)}</div></div>`).join('') || `<div class="empty" style="padding:30px 10px">${t('chatSub')}</div>`;
    box.scrollTop = box.scrollHeight;
  } catch(e){}
}
async function sendChat(){
  const inp = $('chatIn'); const text = inp.value.trim(); if (!text && !S.pendingPhoto) return;
  if (DEMO){ toast('Откройте магазин из Telegram'); return; }
  inp.value='';
  try { await api('/support', { text: text || '📷', photo_url: S.pendingPhoto || '' }); S.pendingPhoto=''; loadChat(); haptic(); } catch(e){ toast(t('net')); }
}
async function onPhotoPicked(ev){
  const f = ev.target.files[0]; if (!f) return;
  try {
    const b64 = await compress(f);
    const r = await api('/upload', { b64: b64.split(',')[1], mime: 'image/jpeg' });
    S.pendingPhoto = r.url;
    toast('Фото готово — нажмите отправить');
  } catch(e){ toast(t('net')); }
  ev.target.value='';
}
function compress(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      const scale = Math.min(1, 900 / Math.max(img.width, img.height));
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

}
const LEGAL = {

  offer: '<h2 class="ovl-title" style="font-size:21px">Условия оферты</h2><div class="card" style="padding:15px;margin-top:12px;cursor:default"><div style="font-size:13px;color:var(--muted);line-height:1.7;font-weight:500">Заказ — оферта на покупку кондитерских изделий ручной работы; оплата подтверждает согласие. Мы свяжемся с вами для подтверждения состава и времени доставки. Скоропортящиеся десерты доставляются курьером в день заказа и возврату не подлежат. Данные (имя, телефон, адрес) используются только для исполнения заказа и не передаются третьим лицам; отозвать согласие можно в чате поддержки.</div></div>',

function openLegal(kind){ $('ovlBackT').textContent = t('profile'); $('ovlBody').innerHTML = LEGAL[kind]; $('ovlGeneric').classList.add('open'); }
function cycleLang(){ const order=['ru','en','uz']; S.lang = order[(order.indexOf(S.lang)+1)%3]; localStorage.setItem('sahar_lang',S.lang); save(); applyLang(); openProfile(); renderNav(); renderChips(); renderSections(); }
function cycleTheme(){ S.theme = {auto:'dark',dark:'light',light:'auto'}[S.theme||'auto']; save(); applyTheme(); openProfile(); }

boot();
