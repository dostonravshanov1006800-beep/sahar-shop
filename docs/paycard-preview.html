<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{background:#F5F0E9;font-family:'Manrope',sans-serif;padding:20px;margin:0}
.btn.btn-pri{background:#3D2F28;color:#fff;border:none;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.dprog{background:#F0E8DC;border-radius:12px;padding:12px 14px;font-size:12.5px;font-weight:600;color:#5E4B3A;line-height:1.45}
.paycard{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(150deg,#0A1A10 0%,#0E2114 52%,#123117 100%);padding:18px 18px 16px;color:#fff;max-width:400px;margin:16px auto 0;box-shadow:0 18px 40px rgba(10,26,16,.45),inset 0 1px 0 rgba(255,255,255,.09)}
.paycard .pc-band{position:absolute;inset:0;background:linear-gradient(115deg,transparent 28%,rgba(21,69,37,.9) 44%,rgba(40,104,58,.45) 60%,transparent 76%);pointer-events:none}
.paycard .pc-top{display:flex;justify-content:space-between;align-items:center;position:relative}
.paycard .pc-bank{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.paycard .pc-bank svg{flex:none}
.paycard .pc-brand{font-weight:800;font-size:13px;letter-spacing:.02em}
.paycard .pc-mid{display:flex;align-items:center;gap:10px;margin:16px 0 10px;position:relative}
.paycard .pc-chip{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#F5D06F,#C89B4B 52%,#E8C56A);position:relative;flex:none}
.paycard .pc-chip::before{content:'';position:absolute;inset:6px 5px;border:1px solid rgba(90,60,15,.55);border-radius:4px}
.paycard .pc-num{position:relative;font-size:19.5px;font-weight:700;letter-spacing:.11em;font-family:'Manrope',sans-serif}
.paycard .pc-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;position:relative}
.paycard .pc-holder{font-size:10.5px;letter-spacing:.16em;color:rgba(255,255,255,.85);font-weight:700;text-transform:uppercase}
.paycard .pc-mc{display:flex;flex:none}
.paycard .pc-mc i{width:22px;height:22px;border-radius:50%;display:block}
.pc-cta{display:flex;gap:8px;margin-top:12px}
.pc-sum{text-align:center;font-weight:800;font-size:15px;margin-top:14px}
.pc-sum span{color:var(--caramel-deep)}
</style></head><body>
<div style="max-width:400px;margin:0 auto">
<div class="paycard">
  <div class="pc-band"></div>
  <div class="pc-top">
    <span class="pc-bank"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.2l2.7 2.7L16.2 9"/></svg>СБЕР БАНК</span>
    <span class="pc-brand">МИР</span>
  </div>
  <div class="pc-mid"><div class="pc-chip"></div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.7" stroke-linecap="round"><path d="M6 8.5a8 8 0 0 1 0 7"/><path d="M9.5 6.5a11 11 0 0 1 0 11"/><path d="M13 4.5a14 14 0 0 1 0 15"/><path d="M16.5 2.8a17.5 17.5 0 0 1 0 18.4"/></svg></div>
  <div class="pc-num">2202 2035 5537 4653</div>
  <div class="pc-bot"><span class="pc-holder">ДОСТОН Р</span></div>
</div>
<div class="pc-sum">К переводу: <span style="color:#6E4B2E">1 620 ₽</span></div>
<div style="margin-top:12px"><button class="btn btn-pri">Скопировать номер</button></div>
<div class="dprog" style="text-align:left;margin-top:12px">После перевода пришлите, пожалуйста, фото чека в чат — мы подтвердим оплату и соберём заказ.</div>
</div></body></html>
